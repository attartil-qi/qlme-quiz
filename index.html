<style>
  :root{
    --parchment:#faf6ea; --parchment-deep:#f1e9d0; --card:#fffdf6;
    --teal:#0e6f68; --teal-deep:#0a5750; --teal-tint:#e7f2f0;
    --gold:#c9a227; --gold-tint:#f4e9c3;
    --emerald:#123c30; --emerald-deep:#0b2a22;
    --text:#233029; --muted:#72806f; --border:#ddd0a4;
    --shadow:0 2px 10px rgba(18,60,48,.08); --shadow-hover:0 8px 24px rgba(18,60,48,.16);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --parchment:#1d201b; --parchment-deep:#252922; --card:#272b24;
      --teal:#4fbcb1; --teal-deep:#7fd3c9; --teal-tint:#1f3431;
      --gold:#e0bd6d; --gold-tint:#3a3322;
      --emerald:#9fdcc6; --emerald-deep:#0b2a22;
      --text:#ece5d2; --muted:#a3ab98; --border:#3d4136;
      --shadow:0 2px 10px rgba(0,0,0,.3); --shadow-hover:0 8px 24px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--parchment);color:var(--text);font-family:Lora,Georgia,serif;line-height:1.55}
  a{color:inherit}
  .ar{font-family:Amiri,"Scheherazade New",serif;direction:rtl;unicode-bidi:isolate}

  /* ---------- Header ---------- */
  header{
    background:
      radial-gradient(circle at 50% 0%, rgba(201,162,39,.18), transparent 60%),
      linear-gradient(180deg,#123c30 0%,#0b2a22 100%);
    color:#f6efd9;text-align:center;padding:40px 16px 36px;position:relative;
    border-bottom:4px solid var(--gold);
  }
  .logo{width:112px;height:112px;border-radius:50%;display:block;margin:0 auto 16px;
    box-shadow:0 0 0 4px rgba(201,162,39,.55),0 6px 20px rgba(0,0,0,.35);background:#fff}
  .bismillah{font-size:1.5rem;color:#e6cf86;margin:0 0 8px}
  h1{font-size:clamp(1.7rem,4.5vw,2.5rem);margin:0;letter-spacing:.01em;font-weight:700}
  .sub{margin:6px 0 0;color:#cfe4dc;font-size:1.02rem}
  .vision{margin:14px auto 0;font-style:italic;color:#e6cf86;font-size:.98rem}
  .stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
  .stat{border:1px solid rgba(230,207,134,.45);border-radius:999px;padding:4px 14px;font-size:.88rem;color:#f6efd9}
  .stat b{color:#e6cf86}

  /* ---------- Controls ---------- */
  main{max-width:1040px;margin:0 auto;padding:0 16px 48px}
  .controls{position:sticky;top:0;z-index:5;background:var(--parchment);padding:14px 0 12px;
    border-bottom:1px solid var(--border);display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .seg{display:inline-flex;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
  .seg button{font:inherit;font-size:.92rem;border:0;background:transparent;color:var(--text);
    padding:8px 16px;border-radius:999px;cursor:pointer;min-height:40px;white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--teal);color:#fff}
  @media (prefers-color-scheme: dark){ .seg button[aria-pressed="true"]{color:#10211d} }
  .search{flex:1 1 240px;max-width:360px;position:relative}
  .search input{width:100%;font:inherit;font-size:.95rem;padding:10px 14px 10px 38px;border-radius:999px;
    border:1px solid var(--border);background:var(--card);color:var(--text);box-shadow:var(--shadow);min-height:42px}
  .search input:focus{outline:2px solid var(--teal);outline-offset:1px}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}

  /* ---------- Sections ---------- */
  .lang-block{margin-top:28px}
  .lang-title{display:flex;align-items:center;gap:12px;margin:0 0 4px;font-size:1.35rem;color:var(--emerald)}
  .lang-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
  .topic{margin-top:22px}
  .topic-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
  .topic-head h3{margin:0;font-size:1.08rem;color:var(--teal-deep);font-weight:600}
  .topic-head h3 .count{color:var(--muted);font-weight:400;font-size:.9rem;margin-left:6px}
  .topic-head .ar{font-size:1.3rem;color:var(--gold)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .card{position:relative;display:flex;flex-direction:column;gap:6px;text-decoration:none;background:var(--card);
    border:1px solid var(--border);border-top:3px solid var(--teal);border-radius:12px;padding:14px 16px;
    box-shadow:var(--shadow);transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;min-height:112px}
  .card:hover,.card:focus-within{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-top-color:var(--gold);outline:none}
  .card .ar{font-size:1.55rem;color:var(--emerald);line-height:1.35}
  .card .t{font-weight:600;font-size:.98rem}
  .card .m{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--muted)}
  .card .go{color:var(--teal);font-weight:600;text-decoration:none}
  .card .go::after{content:"";position:absolute;inset:0;border-radius:12px} /* whole card opens the quiz */
  .card .go:focus-visible{outline:none}
  .card:has(.go:focus-visible){outline:2px solid var(--teal);outline-offset:2px}
  .copy{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
    margin-top:4px;font:inherit;font-size:.84rem;font-weight:600;color:var(--teal-deep);background:var(--teal-tint);
    border:1px solid transparent;border-radius:8px;padding:7px 10px;min-height:38px;cursor:pointer;
    transition:background .15s ease,border-color .15s ease,color .15s ease}
  .copy:hover{border-color:var(--teal)}
  .copy:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .copy svg{width:15px;height:15px;flex:none}
  .copy.done{background:var(--gold-tint);color:var(--emerald);border-color:var(--gold)}
  .copy.fail{background:transparent;border-color:var(--border);color:var(--muted)}
  .tag{display:inline-block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;
    background:var(--teal-tint);color:var(--teal-deep);font-family:Lora,serif}

  .soon{border:1px dashed var(--border);border-radius:12px;padding:14px 16px;color:var(--muted);font-style:italic;font-size:.93rem;background:transparent}
  .empty{text-align:center;color:var(--muted);padding:40px 0;font-style:italic}
  [hidden]{display:none !important}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  footer{text-align:center;color:var(--muted);font-size:.85rem;padding:24px 16px 36px;border-top:1px solid var(--border)}
  footer .ar{font-size:1.2rem;color:var(--gold);display:block;margin-bottom:4px}

  @media (max-width:560px){
    header{padding:32px 16px 30px}
    .logo{width:92px;height:92px}
    .controls{flex-direction:column;align-items:stretch}
    .seg{justify-content:space-between}
    .seg button{flex:1;padding:8px 10px}
    .search{max-width:none;flex:none}
    .seg button{font-size:.86rem}
    .grid{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){ .card{transition:none} }
</style>
</head>

const TOPICS = {
  surah:     { en: "Surah",     ms: "Surah",       ar: "السُّوَر" },
  saraf:     { en: "Ṣarf",      ms: "Saraf",       ar: "الصَّرْف" },
  nahu:      { en: "Naḥw",      ms: "Nahu",        ar: "النَّحْو" },
  balaghah:  { en: "Balāghah",  ms: "Balaghah",    ar: "البَلَاغَة" },
  word_type: { en: "Word Types",ms: "Jenis Kata",  ar: "أَنْوَاعُ الكَلِمَة" }
};
const UI = {
  en: { quiz: n => n === 1 ? "1 quiz" : n + " quizzes", start: "Start →", soon: "Quizzes coming soon, in shā’ Allāh.",
        copy: "Copy Quiz Link", copied: "Link copied!", fail: "Press Ctrl/⌘+C to copy" },
  ms: { quiz: n => n + " kuiz",                          start: "Mula →",  soon: "Kuiz akan datang, insya-Allah.",
        copy: "Salin Pautan Kuiz", copied: "Pautan disalin!", fail: "Tekan Ctrl/⌘+C untuk salin" }
};

const LINK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>';
const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

/* Copy the full public link of a quiz to the clipboard */
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch(_){}
    ta.remove(); return ok;
  }
}
document.addEventListener("click", async ev => {
  const btn = ev.target.closest(".copy"); if (!btn) return;
  ev.preventDefault();
  const u = UI[btn.dataset.lang];
  const url = new URL(btn.dataset.href, location.href).href;
  const ok = await copyText(url);
  btn.classList.remove("done","fail");
  btn.classList.add(ok ? "done" : "fail");
  btn.innerHTML = (ok ? CHECK_ICON : LINK_ICON) + `<span>${ok ? u.copied : u.fail}</span>`;
  if (!ok) window.prompt(u.fail, url);
  document.getElementById("live").textContent = ok ? u.copied : "";
  clearTimeout(btn._t);
  btn._t = setTimeout(() => { btn.classList.remove("done","fail"); btn.innerHTML = LINK_ICON + `<span>${u.copy}</span>`; }, 2000);
});

const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const href = p => p.split("/").map(encodeURIComponent).join("/");

function render(){
  const dir = document.getElementById("directory");
  let html = "", total = 0, topicsWithQuizzes = new Set();
  for (const [code, L] of Object.entries(LANGS)){
    html += `<section class="lang-block" data-lang="${code}"><h2 class="lang-title">${L.name}</h2>`;
    for (const [key, list] of Object.entries(L.topics)){
      const T = TOPICS[key], u = UI[code];
      total += list.length; if (list.length) topicsWithQuizzes.add(key);
      html += `<div class="topic" data-empty="${!list.length}">
        <div class="topic-head"><h3>${code === "ms" ? T.ms : T.en}<span class="count">${list.length ? u.quiz(list.length) : ""}</span></h3>
        <span class="ar" lang="ar">${T.ar}</span></div>`;
      if (!list.length){ html += `<div class="soon">${u.soon}</div></div>`; continue; }
      html += `<div class="grid">` + list.map(q => `
        <div class="card" data-search="${esc((q.title + " " + (q.ar||"") + " " + T.en + " " + T.ms + " " + L.name).toLowerCase())}">
          ${q.ar ? `<span class="ar" lang="ar">${q.ar}</span>` : ""}
          <span class="t">${esc(q.title)}</span>
          <span class="m"><span class="tag">${code === "en" ? "EN" : "BM"}</span><a class="go" href="${href(q.path)}" aria-label="${esc(q.title)}: ${u.start.replace(' →','')}">${u.start}</a></span>
          <button type="button" class="copy" data-href="${href(q.path)}" data-lang="${code}" aria-label="${u.copy}: ${esc(q.title)}">${LINK_ICON}<span>${u.copy}</span></button>
        </div>`).join("") + `</div></div>`;
    }
    html += `</section>`;
  }
  dir.innerHTML = html;
  document.getElementById("stats").innerHTML =
    `<span class="stat"><b>${total}</b> quizzes · kuiz</span>
     <span class="stat"><b>${Object.keys(LANGS).length}</b> languages · bahasa</span>
     <span class="stat"><b>${topicsWithQuizzes.size}</b> topics · topik</span>`;
}

let lang = "all";
function applyFilter(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll(".lang-block").forEach(block => {
    const langOk = lang === "all" || block.dataset.lang === lang;
    let blockShown = 0;
    block.querySelectorAll(".topic").forEach(topic => {
      let n = 0;
      topic.querySelectorAll(".card").forEach(c => {
        const ok = langOk && (!q || c.dataset.search.includes(q));
        c.hidden = !ok; if (ok) n++;
      });
      // while searching, hide empty "coming soon" topics and topics with no matches
      topic.hidden = !langOk || (q ? n === 0 : false);
      blockShown += n;
    });
    block.hidden = !langOk || (q && blockShown === 0);
    shown += blockShown;
  });
  document.getElementById("empty").hidden = !(q && shown === 0);
}

document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
  try { localStorage.setItem("qlme-lang", lang); } catch(e){}
  applyFilter();
}));
document.getElementById("q").addEventListener("input", applyFilter);
document.getElementById("yr").textContent = new Date().getFullYear();

render();
try {
  const saved = localStorage.getItem("qlme-lang");
  if (saved) document.querySelector(`.seg button[data-lang="${saved}"]`)?.click();
} catch(e){}
applyFilter();
</script>
