<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasrif Quiz — نظر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  .brand-logo{
    display:block;
    width:96px;
    height:96px;
    margin:0 auto 12px;
  }
  /* Show the logo on the landing and results screens; hide it during questions to save space on phones */
  body:has(#quizScreen:not(.hidden)) .brand-logo{display:none;}
  @font-face{
    font-family:'UthmanicHafs';
    src:url('https://cdn.jsdelivr.net/gh/mustafa0x/qpc-fonts@f93bf5f3/various-woff2/UthmanicHafs1%20Ver09.woff2') format('woff2');
    font-display:swap;
  }
  :root{
    --parchment:#faf5e6;
    --parchment-deep:#f2ead4;
    --teal:#1f7a72;
    --teal-dark:#155c56;
    --gold:#b8912f;
    --gold-light:#e8d8a8;
    --emerald:#0d3b34;
    --correct:#2e7d46;
    --correct-bg:#e5f3e8;
    --incorrect:#a33636;
    --incorrect-bg:#fbe9e7;
    --shadow: 0 4px 18px rgba(13,59,52,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Lora', serif;
    background: linear-gradient(180deg, var(--parchment) 0%, var(--parchment-deep) 100%);
    color:var(--emerald);
    min-height:100vh;
    padding:20px 14px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  .arabic{font-family:'UthmanicHafs','Amiri', serif;}
  header.top{
    text-align:center;
    padding:22px 18px 26px;
    border-bottom:3px solid var(--gold);
    margin-bottom:22px;
  }
  header.top h1{color:var(--emerald);font-size:1.6rem;margin:0 0 6px;letter-spacing:0.3px;}
  header.top .root-badge{
    display:inline-block;font-family:'UthmanicHafs','Amiri',serif;font-size:2rem;color:var(--teal-dark);
    background:#fff;border:2px solid var(--gold);border-radius:12px;padding:6px 22px;
    margin-top:6px;box-shadow: var(--shadow);
  }
  header.top p.sub{color:#5b6b63;font-size:0.95rem;margin-top:10px;}
  .card{
    background:#fffdf8;border:1px solid var(--gold-light);border-radius:14px;
    box-shadow:var(--shadow);padding:22px 22px 24px;margin-bottom:18px;
  }
  #intro .stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:18px 0;}
  #intro .stat{background:var(--parchment-deep);border:1px solid var(--gold-light);border-radius:10px;padding:10px 16px;text-align:center;min-width:110px;}
  #intro .stat b{display:block;color:var(--teal-dark);font-size:1.3rem;}
  #intro .stat span{font-size:0.78rem;color:#5b6b63;}
  .student-info{
    display:flex;flex-direction:column;gap:14px;max-width:320px;margin:20px auto 4px;
  }
  .student-info label{
    text-align:left;font-size:0.82rem;font-weight:700;color:var(--emerald);
    text-transform:uppercase;letter-spacing:0.4px;
  }
  .student-info input[type="text"]{
    display:block;width:100%;margin-top:5px;padding:10px 12px;
    border:1.5px solid var(--gold-light);border-radius:8px;
    font-family:'Lora',serif;font-size:0.95rem;color:var(--emerald);background:#fff;
    box-sizing:border-box;
  }
  .student-info input[type="text"]:focus{outline:none;border-color:var(--teal);}
  .level-choice{
    display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:22px;
  }
  .level-card{
    flex:1 1 220px;max-width:260px;background:var(--parchment-deep);
    border:1.5px solid var(--gold-light);border-radius:12px;padding:16px 16px 18px;text-align:center;
  }
  .level-card h3{margin:0 0 6px;color:var(--emerald);font-size:1rem;}
  .level-card p{margin:0 0 14px;font-size:0.82rem;color:#5b6b63;line-height:1.4;}
  .submit-status{
    text-align:center;font-size:0.85rem;color:#5b6b63;margin:4px 0 18px;min-height:20px;
  }
  .submit-status.ok{color:var(--correct);font-weight:600;}
  .submit-status.warn{color:#96721f;font-weight:600;}
  .btn{
    display:inline-block;background:var(--teal);color:#fff;border:none;border-radius:10px;
    padding:13px 26px;font-family:'Lora',serif;font-size:1rem;font-weight:600;cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .btn:hover{background:var(--teal-dark);}
  .btn:active{transform:scale(0.98);}
  .btn.gold{background:var(--gold);}
  .btn.gold:hover{background:#96721f;}
  .btn:disabled{background:#ccc;cursor:not-allowed;}
  .btn-row{text-align:center;margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .progress-wrap{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-size:0.85rem;color:var(--teal-dark);font-weight:600;}
  .progress-bar{flex:1;height:8px;background:var(--parchment-deep);border-radius:6px;overflow:hidden;border:1px solid var(--gold-light);}
  .progress-fill{height:100%;background:linear-gradient(90deg, var(--gold), var(--teal));transition:width .3s ease;}
  .ayah-ref{font-size:0.82rem;color:var(--gold);font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:8px;}
  .ayah-box{
    direction:rtl;font-family:'UthmanicHafs','Amiri', serif;font-size:1.85rem;line-height:2.5;text-align:center;
    color:var(--emerald);background:var(--parchment-deep);border:1px solid var(--gold-light);
    border-radius:10px;padding:18px 14px;margin-bottom:18px;
  }
  .ayah-box .target-word{color:var(--teal-dark);border-bottom:3px dotted var(--gold);padding-bottom:2px;}
  .gloss-title{font-size:0.82rem;text-transform:uppercase;letter-spacing:0.5px;color:#5b6b63;margin:6px 0 8px;font-weight:700;}
  .gloss-table{display:flex;flex-wrap:wrap;gap:8px;direction:rtl;margin-bottom:20px;}
  .gloss-item{background:#fff;border:1px solid var(--gold-light);border-radius:8px;padding:6px 10px;text-align:center;min-width:64px;}
  .gloss-item.blank{border:2px dashed var(--teal);background:#eef7f6;}
  .gloss-item .ar{font-family:'UthmanicHafs','Amiri',serif;font-size:1.2rem;color:var(--emerald);}
  .gloss-item .tr{font-size:0.72rem;color:#6a7a72;direction:ltr;margin-top:2px;}
  .gloss-item.blank .tr{color:var(--teal-dark);font-weight:700;}
  .part{margin-bottom:22px;}
  .part-label{font-weight:700;color:var(--emerald);margin-bottom:4px;font-size:0.98rem;display:flex;align-items:center;gap:8px;}
  .part-sub{font-size:0.82rem;color:#6a7a72;margin-bottom:10px;}
  .part-label .tag{background:var(--teal);color:#fff;font-size:0.68rem;padding:2px 8px;border-radius:20px;letter-spacing:0.4px;text-transform:uppercase;}
  .options{display:flex;flex-direction:column;gap:8px;}
  .option{
    border:1.5px solid var(--gold-light);background:#fff;border-radius:9px;padding:11px 14px;
    cursor:pointer;font-size:0.96rem;display:flex;align-items:center;gap:10px;
    transition:border-color .15s, background .15s;
  }
  .option:hover{border-color:var(--teal);}
  .option input{accent-color:var(--teal);}
  .option.correct{background:var(--correct-bg);border-color:var(--correct);color:var(--correct);font-weight:600;}
  .option.incorrect{background:var(--incorrect-bg);border-color:var(--incorrect);color:var(--incorrect);font-weight:600;}
  .option.locked{cursor:default;}
  .explain{margin-top:10px;background:var(--parchment-deep);border-left:4px solid var(--gold);padding:10px 14px;border-radius:0 8px 8px 0;font-size:0.88rem;color:#3f4e47;display:none;}
  .explain.show{display:block;}
  .assist-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .assist-btn{
    padding:8px 16px;font-size:0.82rem;background:#fff;color:var(--teal-dark);
    border:1.5px solid var(--teal);border-radius:8px;font-family:'Lora',serif;font-weight:600;cursor:pointer;
  }
  .assist-btn:hover:not(:disabled){background:var(--parchment-deep);}
  .assist-btn:disabled{background:#f2efe6;color:#9aa39c;border-color:#ddd6c2;cursor:default;}
  #assistLegend{display:flex;gap:6px;flex-wrap:wrap;}
  .legend-chip{
    display:inline-block;padding:3px 10px;border-radius:20px;font-size:0.7rem;font-weight:700;
    border:1.5px solid currentColor;
  }
  .morph-harf{color:#a3771f;font-weight:700;}
  .morph-fiil{color:var(--teal-dark);font-weight:700;}
  .morph-pronoun{color:#7a4f8a;font-weight:700;}
  .legend-chip.morph-harf{background:#faf1d9;}
  .legend-chip.morph-fiil{background:#e8f3f1;}
  .legend-chip.morph-pronoun{background:#f2e9f4;}
  #results .score-circle{
    width:150px;height:150px;border-radius:50%;border:10px solid var(--gold-light);
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    margin:10px auto 20px;background:#fff;
  }
  #results .score-circle b{font-size:2.1rem;color:var(--teal-dark);}
  #results .score-circle span{font-size:0.78rem;color:#5b6b63;}
  .review-item{border-bottom:1px solid var(--gold-light);padding:10px 0;font-size:0.9rem;}
  .review-item .ref{color:var(--gold);font-weight:700;}
  .review-item .status-ok{color:var(--correct);font-weight:700;}
  .review-item .status-bad{color:var(--incorrect);font-weight:700;}
  .hidden{display:none !important;}
  footer{text-align:center;color:#8a9990;font-size:0.78rem;margin-top:30px;}
</style>
</head>

  p1Label:"Translate the word",
  p1:{opts:["(all of you) wait for us!","(you) wait for us!","(all of you) wait for them!","they waited for us"],correct:0,
      note:"Here نَظَرَ, used with a direct object, means 'to wait for' (the corpus glosses it 'Wait for us'). انْظُرُوا is a command to a group, and ـنَا is the object, 'us'. When ـنَا is added, the written alif after the و drops: انْظُرُوا + نَا → انْظُرُونَا. The hypocrites call to the believers: 'Wait for us, so we may take some of your light'."},
  p2:{opts:["فعل أمر (command/imperative verb)","فعل مضارع (present-tense verb)","فعل ماضي (past-tense verb)","اسم فاعل (active participle/do-er noun)"],correct:0,
      note:"Hamzat al-waṣl, واو الجماعة and no ن of the present tense: a plural فعل أمر, like فَانْظُرُوا in 3:137. The ـنَا is the attached object pronoun."}
}
];

/* ============ ENGINE ============ */
let quiz = [];
let current = 0;
let answers = [];
let checked = false;
let assistiveOn = false;
let studentName = '';
let studentClass = '';
let currentLevel = 1;

/* Results go to the shared AtTartil results script, which keeps one Sheet per quiz
   in Drive (ATTARTIL CLAUDE QUIZZES > folder below), creating it on first use. */
const SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwgOZ19URzMO-lzBwWM9L2IgMwnNe7b-n5v5fil6tGX_LrZ3St3y6U8zmQtL57oQEhE/exec";
const RESULTS_SHEET = {
  quizId: "english/saraf/tasrif_quiz_nzr",
  folder: ["English", "Saraf", "Tasrif Quiz نظر"],
  sheetTitle: "Results: Quiz Tasrif نظر"
};

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildOptionShuffle(optsArr, correctIdx){
  const idxArr = optsArr.map((_,i)=>i);
  const shuffled = shuffleArr(idxArr);
  return { order: shuffled, newCorrect: shuffled.indexOf(correctIdx) };
}

function morphClass(type){
  if(type==='harf') return 'morph-harf';
  if(type==='pronoun') return 'morph-pronoun';
  return 'morph-fiil';
}
function morphRoleLabel(type){
  return T.roles[type] || type;
}
function buildMorphSpans(morphemes){
  return morphemes.map(m=>`<span class="${morphClass(m.type)}">${m.text}</span>`).join('');
}
function buildLegendChips(morphemes){
  const seen = [];
  morphemes.forEach(m=>{ if(!seen.includes(m.type)) seen.push(m.type); });
  return seen.map(t=>`<span class="legend-chip ${morphClass(t)}">${morphRoleLabel(t)}</span>`).join('');
}

function startQuiz(level){
  const nameVal = document.getElementById('studentName').value.trim();
  const classVal = document.getElementById('studentClass').value.trim();
  if(!nameVal || !classVal){
    alert(T.needNameClass);
    return;
  }
  studentName = nameVal;
  studentClass = classVal;
  currentLevel = level;

  const bank = level === 2 ? LEVEL2_BANK : LEVEL1_BANK;
  quiz = shuffleArr(bank).map(q=>{
    const p1Shuf = buildOptionShuffle(q.p1.opts, q.p1.correct);
    const p2Shuf = buildOptionShuffle(q.p2.opts, q.p2.correct);
    return {...q, p1Shuf, p2Shuf};
  });
  current = 0;
  answers = quiz.map(()=>({p1:null,p2:null}));
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('results').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  renderQuestion();
}

function goToIntro(){
  document.getElementById('results').classList.add('hidden');
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('intro').classList.remove('hidden');
}

function renderQuestion(){
  checked = false;
  assistiveOn = false;
  const q = quiz[current];
  document.getElementById('qCounter').textContent = T.counter(current+1, quiz.length);
  document.getElementById('progressFill').style.width = `${((current+1)/quiz.length)*100}%`;

  const hasBreakdown = q.morphemes && q.morphemes.length > 1;

  let glossHtml = '';
  q.gloss.forEach(w=>{
    if(w.target){
      glossHtml += `<div class="gloss-item blank"><div class="ar">${w.ar}</div><div class="tr">?</div></div>`;
    } else {
      glossHtml += `<div class="gloss-item"><div class="ar">${w.ar}</div><div class="tr">${w.tr}</div></div>`;
    }
  });

  function optionsHtml(name, optsArr, order, chosen, part){
    return order.map((origIdx,pos)=>{
      const label = optsArr[origIdx];
      return `<label class="option" data-part="${part}" data-idx="${pos}">
        <input type="radio" name="${name}" value="${pos}" ${chosen===pos?'checked':''} onchange="selectOption('${part}',${pos})">
        <span>${label}</span>
      </label>`;
    }).join('');
  }

  document.getElementById('questionCard').innerHTML = `
    <div class="ayah-ref">${T.levelWord} ${currentLevel} · ${T.surahWord} ${q.surah} — ${q.ref}</div>
    <div class="ayah-box">${q.ayah.replace(q.targetWord, `<span class="target-word">${q.targetWord}</span>`)}</div>
    <div class="assist-row">
      <button class="btn assist-btn" id="assistBtn" onclick="toggleAssistive()" ${hasBreakdown?'':`disabled title="${T.breakdownNoneTitle}"`}>
        ${hasBreakdown ? T.breakdownShow : T.breakdownNone}
      </button>
      <span id="assistLegend"></span>
    </div>
    <div class="gloss-title">${T.glossTitle}</div>
    <div class="gloss-table">${glossHtml}</div>

    <div class="part">
      <div class="part-label"><span class="tag">${T.part} 1</span>${q.p1Label}</div>
      <div class="options" id="p1Options">
        ${optionsHtml('p1', q.p1.opts, q.p1Shuf.order, answers[current].p1, 'p1')}
      </div>
      <div class="explain" id="p1Explain">${q.p1.note}</div>
    </div>

    <div class="part">
      <div class="part-label"><span class="tag">${T.part} 2</span>${T.p2Label}</div>
      <div class="options" id="p2Options">
        ${optionsHtml('p2', q.p2.opts, q.p2Shuf.order, answers[current].p2, 'p2')}
      </div>
      <div class="explain" id="p2Explain">${q.p2.note}</div>
    </div>
  `;

  document.getElementById('checkBtn').classList.remove('hidden');
  document.getElementById('checkBtn').disabled = false;
  document.getElementById('nextBtn').classList.add('hidden');
  document.getElementById('nextBtn').textContent = current < quiz.length-1 ? T.nextQuestion : T.seeResults;
}

function toggleAssistive(){
  const q = quiz[current];
  if(!q.morphemes || q.morphemes.length<=1) return;
  assistiveOn = !assistiveOn;
  updateAssistiveDisplay();
}

function updateAssistiveDisplay(){
  const q = quiz[current];
  const fullToken = q.gloss.find(w=>w.target).ar;
  const ayahBoxEl = document.querySelector('.ayah-box');
  const blankArEl = document.querySelector('.gloss-item.blank .ar');
  const legendEl = document.getElementById('assistLegend');
  const btn = document.getElementById('assistBtn');

  if(assistiveOn && q.morphemes && q.morphemes.length>1){
    if(ayahBoxEl) ayahBoxEl.innerHTML = q.ayah.replace(fullToken, buildMorphSpans(q.morphemes));
    if(blankArEl) blankArEl.innerHTML = buildMorphSpans(q.morphemes);
    if(legendEl) legendEl.innerHTML = buildLegendChips(q.morphemes);
    if(btn) btn.innerHTML = T.breakdownHide;
  } else {
    if(ayahBoxEl) ayahBoxEl.innerHTML = q.ayah.replace(q.targetWord, `<span class="target-word">${q.targetWord}</span>`);
    if(blankArEl) blankArEl.innerHTML = fullToken;
    if(legendEl) legendEl.innerHTML = '';
    if(btn && q.morphemes && q.morphemes.length>1) btn.innerHTML = T.breakdownShow;
  }
}

function selectOption(part, pos){
  if(checked) return;
  answers[current][part] = pos;
}

function checkAnswers(){
  const q = quiz[current];
  if(answers[current].p1===null || answers[current].p2===null){
    alert(T.needBoth);
    return;
  }
  checked = true;

  function markPart(part, shuf, containerId, explainId){
    const chosenPos = answers[current][part];
    const container = document.getElementById(containerId);
    const opts = container.querySelectorAll('.option');
    opts.forEach((el,pos)=>{
      el.classList.add('locked');
      if(pos === shuf.newCorrect) el.classList.add('correct');
      else if(pos === chosenPos) el.classList.add('incorrect');
    });
    document.getElementById(explainId).classList.add('show');
    return chosenPos === shuf.newCorrect;
  }

  let pts = 0;
  if(markPart('p1', q.p1Shuf, 'p1Options', 'p1Explain')) pts++;
  if(markPart('p2', q.p2Shuf, 'p2Options', 'p2Explain')) pts++;

  quiz[current]._earned = pts;
  quiz[current]._max = 2;

  document.getElementById('checkBtn').disabled = true;
  document.getElementById('nextBtn').classList.remove('hidden');
}

function nextQuestion(){
  if(current < quiz.length-1){
    current++;
    renderQuestion();
  } else {
    showResults();
  }
}

let lastSubmitPayload = null;

function showResults(){
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');

  const scoreTotal = quiz.reduce((s,q)=>s+(q._earned||0),0);
  const scoreMax = quiz.reduce((s,q)=>s+(q._max||0),0);
  const pct = scoreMax ? Math.round((scoreTotal/scoreMax)*100) : 0;

  document.getElementById('resultsHeading').textContent = T.wellDone(studentName, currentLevel);
  document.getElementById('scorePct').textContent = pct+'%';
  document.getElementById('scoreFrac').textContent = T.points(scoreTotal, scoreMax);

  let html = '';
  const detailParts = [];
  quiz.forEach((q,i)=>{
    const full = q._earned === q._max;
    html += `<div class="review-item">
      <span class="ref">${i+1}. ${T.surahWord} ${q.surah} ${q.ref}</span> — <span class="arabic">${q.targetWord}</span>
      — <span class="${full?'status-ok':'status-bad'}">${q._earned}/${q._max}</span>
    </div>`;
    detailParts.push(`${q.ref} (${q._earned}/${q._max})`);
  });
  document.getElementById('reviewList').innerHTML = html;

  lastSubmitPayload = {
    name: studentName,
    className: studentClass,
    level: currentLevel,
    score: scoreTotal,
    scoreMax: scoreMax,
    percentage: pct,
    details: detailParts.join('; '),
    submittedAt: new Date().toISOString()
  };
  Object.assign(lastSubmitPayload, RESULTS_SHEET, {ref: "main", columns: [
    ["Name", lastSubmitPayload.name], ["Class", lastSubmitPayload.className], ["Level", lastSubmitPayload.level],
    ["Score", lastSubmitPayload.score], ["Out of", lastSubmitPayload.scoreMax], ["Percentage", lastSubmitPayload.percentage + "%"],
    ["Per-question breakdown", lastSubmitPayload.details], ["Timestamp (submitted)", lastSubmitPayload.submittedAt]
  ]});
  submitResult(lastSubmitPayload);
}

async function submitResult(data){
  const statusEl = document.getElementById('submitStatus');
  if(!SHEET_WEBAPP_URL || SHEET_WEBAPP_URL.indexOf('PASTE_YOUR') !== -1){
    if(statusEl){
      statusEl.className = 'submit-status warn';
      statusEl.textContent = T.notLinked;
    }
    return;
  }
  if(statusEl){
    statusEl.className = 'submit-status';
    statusEl.textContent = T.submitting;
  }
  try{
    await fetch(SHEET_WEBAPP_URL, {
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(data)
    });
    if(statusEl){
      statusEl.className = 'submit-status ok';
      statusEl.textContent = T.submitted;
    }
  }catch(err){
    if(statusEl){
      statusEl.className = 'submit-status warn';
      statusEl.innerHTML = T.submitFailed + ' <button class="btn gold" style="padding:5px 12px;font-size:0.78rem;" onclick="retrySubmit()">' + T.retry + '</button>';
    }
  }
}

function retrySubmit(){
  if(lastSubmitPayload) submitResult(lastSubmitPayload);
}
</script>
