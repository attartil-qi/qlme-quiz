<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz: Signs of Isim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family:'UthmanicHafs';
    src:url('https://cdn.jsdelivr.net/gh/mustafa0x/qpc-fonts@f93bf5f3/various-woff2/UthmanicHafs1%20Ver09.woff2') format('woff2');
    font-display:swap;
  }
  :root{
    --parchment:#faf5e6; --parchment-deep:#f2ead4;
    --teal:#1f7a72; --teal-dark:#155c56; --teal-tint:#e6f1ef;
    --gold:#b8912f; --gold-light:#e8d8a8;
    --emerald:#0d3b34;
    --good:#2e7d46; --good-bg:#e5f3e8;
    --bad:#a33636; --bad-bg:#fbe9e7;
    --card:#fffdf8; --muted:#6b7a70;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Lora',serif; color:var(--emerald); line-height:1.55;
    background:linear-gradient(180deg,var(--parchment) 0%,var(--parchment-deep) 100%); min-height:100vh;}
  .arabic{font-family:'UthmanicHafs','Amiri',serif; direction:rtl; unicode-bidi:isolate;}
  .wrap{max-width:760px; margin:0 auto; padding:22px 16px 56px;}
  header.top{text-align:center; padding:18px 12px 16px; border-bottom:3px solid var(--gold); margin-bottom:20px;}
  .brand-logo{display:block;width:96px;height:96px;margin:0 auto 12px;}
  body:has(#screen-quiz:not(.hidden)) .brand-logo{display:none;}
  header.top h1{font-size:1.6rem; margin:0 0 4px; color:var(--emerald);}
  .badge{display:inline-block; background:var(--teal-tint); color:var(--teal-dark); border:1px solid var(--gold-light);
    border-radius:99px; padding:3px 14px; font-size:1.25rem;}
  .card{background:var(--card); border:1px solid var(--gold-light); border-radius:14px; padding:22px;
    margin-bottom:18px; box-shadow:0 3px 14px rgba(13,59,52,.08);}
  .field{margin-bottom:16px;}
  .field label{display:block; font-weight:600; font-size:.92rem; margin-bottom:6px;}
  .field input{width:100%; padding:11px 13px; border:1.5px solid var(--gold-light); border-radius:10px;
    font-family:'Lora',serif; font-size:1rem; background:#fffefb; color:var(--emerald);}
  .field input:focus{outline:2px solid var(--gold-light); border-color:var(--teal);}
  button{font-family:'Lora',serif; cursor:pointer; border:none; border-radius:10px; font-size:1rem; font-weight:600; padding:12px 20px;}
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-primary:hover:not(:disabled){background:var(--teal-dark);}
  .btn-gold{background:var(--gold); color:#fff;}
  .btn-ghost{background:transparent; color:var(--teal-dark); border:1.5px solid var(--teal);}
  button:disabled{opacity:.45; cursor:not-allowed;}
  .row-btns{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px;}
  .hidden{display:none !important;}
  .small-note{font-size:.85rem; color:var(--muted);}
  .progress-label{font-size:.85rem; color:var(--muted); margin-bottom:6px;}
  .progress-bar{background:#fff; border:1px solid var(--gold-light); border-radius:99px; height:10px; overflow:hidden; margin-bottom:16px;}
  .progress-fill{background:var(--teal); height:100%; transition:width .25s;}
  .qprompt{font-size:1.12rem; font-weight:600; margin:0 0 6px;}
  .qhint{font-size:.85rem; color:var(--teal-dark); font-style:italic; margin:0 0 12px;}
  .ayah-box{background:var(--parchment); border:1px solid var(--gold-light); border-radius:12px; padding:14px 16px;
    font-size:1.75rem; line-height:2.3; text-align:center; margin-bottom:6px;}
  .ayah-ref{text-align:center; font-size:.82rem; color:var(--muted); margin-bottom:10px;}
  .toggle-link{display:inline-block; font-size:.88rem; color:var(--teal-dark); text-decoration:underline; cursor:pointer; margin-bottom:12px;}
  .interlinear{display:flex; flex-wrap:wrap; gap:10px 14px; justify-content:center; direction:rtl;
    background:var(--parchment); border:1px dashed var(--gold); border-radius:12px; padding:12px; margin-bottom:14px;}
  .iword{display:flex; flex-direction:column; align-items:center; min-width:58px; max-width:130px;}
  .iword .ar{font-family:'UthmanicHafs','Amiri',serif; font-size:1.45rem;}
  .iword .gl{font-size:.72rem; color:var(--teal-dark); text-align:center; direction:ltr;}
  .iverse{font-family:'UthmanicHafs','Amiri',serif; font-size:1.2rem; color:var(--gold); align-self:center;}
  .after-label{display:block; font-weight:600; color:var(--emerald); margin:12px 0 6px; font-size:.9rem;}
  .feedback .interlinear{margin-bottom:4px;}
  .feedback .iword .ar{color:var(--emerald);}
  .trans{background:#fffefb; border:1px solid var(--gold-light); border-radius:10px; padding:10px 12px; color:var(--emerald);}
  .trans .vn{color:var(--gold); font-weight:600; margin-right:4px;}
  .opt{display:flex; align-items:center; gap:12px; padding:11px 14px; border:1.5px solid var(--gold-light);
    border-radius:10px; margin-bottom:9px; cursor:pointer; background:#fffefb;}
  .opt:hover{border-color:var(--teal);}
  .opt input{transform:scale(1.2); accent-color:var(--teal);}
  .opt.ar-opt span{font-family:'UthmanicHafs','Amiri',serif; font-size:1.7rem; line-height:1.8;}
  .opt.correct{border-color:var(--good); background:var(--good-bg);}
  .opt.wrong{border-color:var(--bad); background:var(--bad-bg);}
  .feedback{border-radius:10px; padding:11px 14px; margin:12px 0 4px; font-size:.94rem;}
  .feedback.good{background:var(--good-bg); color:var(--good); border:1px solid var(--good);}
  .feedback.bad{background:var(--bad-bg); color:var(--bad); border:1px solid var(--bad);}
  .feedback .note{display:block; color:var(--emerald); margin-top:6px;}
  .feedback .note .arabic{font-size:1.25rem;}
  .score-circle{width:150px; height:150px; border-radius:50%; margin:6px auto 10px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; border:6px solid var(--teal); background:var(--teal-tint);}
  .score-circle .pct{font-size:2.1rem; font-weight:700;}
  .score-circle .pts{font-size:.9rem; color:var(--teal-dark);}
  .review-item{display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--gold-light); font-size:.92rem;}
  .review-item .mark{font-weight:700; min-width:22px;}
  .review-item.ok .mark{color:var(--good);} .review-item.no .mark{color:var(--bad);}
  .status-line{text-align:center; font-size:.9rem; margin:6px 0 2px;}
  .status-line.ok{color:var(--good);} .status-line.err{color:var(--bad);}
  .footer{text-align:center; color:var(--teal-dark); font-size:.85rem; margin-top:14px; opacity:.9;}
</style>
</head>

  {en:"Is Allah not the most just of all judges?", ms:"Bukankah Allah (yang demikian kekuasaanNya) seadil-adil Hakim?"}
];
const AR_NUM = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
// Fix for the KFGQPC font: U+06DF (small circle on silent alif) draws as a placeholder; U+0652 draws correctly.
const fixQ = s => s.replace(/۟/g, 'ْ');
function ayahText(verses, firstNum, numbered){
  return verses.map((v,i)=> v.map(w=>fixQ(w[0])).join(' ') + (numbered ? ` ﴿${AR_NUM(firstNum+i)}﴾` : '')).join(' ');
}

];

/* ================= ENGINE ================= */
const $ = id => document.getElementById(id);

let state = null;

// Static UI text
document.title = T.title;
$('title').textContent = T.title;
$('intro').innerHTML = T.intro;
$('nameLabel').textContent = T.nameLabel; $('stuName').placeholder = T.namePh;
$('classLabel').textContent = T.classLabel; $('stuClass').placeholder = T.classPh;
$('startBtn').textContent = T.beginQuiz;
$('checkBtn').textContent = T.checkAnswers;
$('doneTitle').textContent = T.done;
$('reviewTitle').textContent = T.review;
$('retrySubmitBtn').textContent = T.retrySubmit;
$('retryBtn').textContent = T.retry;
$('homeBtn').textContent = T.home;

function startReady(){ $('startBtn').disabled = !($('stuName').value.trim() && $('stuClass').value.trim()); }
['stuName','stuClass'].forEach(id=>$(id).addEventListener('input', startReady));
$('startBtn').addEventListener('click', startQuiz);
$('retryBtn').addEventListener('click', startQuiz);
$('homeBtn').addEventListener('click', ()=>{ show('screen-start'); startReady(); });
$('checkBtn').addEventListener('click', checkAnswer);
$('nextBtn').addEventListener('click', nextQuestion);
$('retrySubmitBtn').addEventListener('click', ()=>submitResults(state.payload));

function show(id){ ['screen-start','screen-quiz','screen-result'].forEach(s=>$(s).classList.toggle('hidden', s!==id)); window.scrollTo(0,0); }

function startQuiz(){
  if(!($('stuName').value.trim() && $('stuClass').value.trim())) return;
  state = {
    name:$('stuName').value.trim(), cls:$('stuClass').value.trim(),
    steps: QUESTIONS.map(q=>({q, order: q.options.map((_,i)=>i), right:null})),
    current:0
  };
  show('screen-quiz');
  renderStep();
}

function renderStep(){
  const {q, order} = state.steps[state.current];
  const total = state.steps.length;
  $('progressLabel').textContent = `${T.question} ${state.current+1} ${T.of} ${total}`;
  $('progressFill').style.width = `${(state.current/total)*100}%`;
  $('qPrompt').textContent = L(q.prompt);
  $('qHint').textContent = q.multi ? (q.pick ? T.chooseN(q.pick) : T.chooseMany) : T.chooseOne;

  if(q.verses){
    $('ayahWrap').classList.remove('hidden');
    $('ayahBox').textContent = ayahText(q.verses, q.firstAyah, q.numbered);
    $('ayahRef').textContent = q.ref;
  } else {
    $('ayahWrap').classList.add('hidden');
  }

  const box = $('optionsBox'); box.innerHTML='';
  order.forEach(oi=>{
    const lab=document.createElement('label');
    lab.className='opt'+(q.arabicOptions?' ar-opt':''); lab.dataset.idx=oi;
    const inp=document.createElement('input');
    inp.type=q.multi?'checkbox':'radio'; inp.name='opt'; inp.value=oi;
    inp.addEventListener('change', ()=>{ $('checkBtn').disabled = !box.querySelector('input:checked'); });
    const sp=document.createElement('span'); sp.textContent=L(q.options[oi]);
    if(q.arabicOptions) sp.className='arabic';
    lab.append(inp, sp); box.appendChild(lab);
  });
  $('feedbackBox').innerHTML='';
  $('checkBtn').disabled=true; $('checkBtn').classList.remove('hidden');
  $('nextBtn').classList.add('hidden');
}

function checkAnswer(){
  const step = state.steps[state.current], q = step.q;
  const picked = [...document.querySelectorAll('#optionsBox input:checked')].map(i=>+i.value);
  const right = picked.length===q.correct.length && q.correct.every(c=>picked.includes(c));
  step.right = right;
  document.querySelectorAll('#optionsBox .opt').forEach(lab=>{
    const i=+lab.dataset.idx;
    lab.querySelector('input').disabled=true;
    if(q.correct.includes(i)) lab.classList.add('correct');
    else if(picked.includes(i)) lab.classList.add('wrong');
  });
  $('feedbackBox').innerHTML = `<div class="feedback ${right?'good':'bad'}"><b>${right?T.correct:T.incorrect}</b><span class="note">${L(q.note)}</span></div>`;
  if(q.verses) $('feedbackBox').firstChild.appendChild(afterAnswerTranslation(q));
  $('checkBtn').classList.add('hidden');
  const last = state.current === state.steps.length-1;
  $('nextBtn').textContent = last ? T.seeResults : T.nextQuestion;
  $('nextBtn').classList.remove('hidden');
  if(last){ $('progressFill').style.width='100%'; finishQuiz(); }  // auto-submit on the last check
}

// Word-by-word glosses and the full translation, revealed only after the student answers.
function afterAnswerTranslation(q){
  const wrap=document.createElement('div');
  const l1=document.createElement('span'); l1.className='after-label'; l1.textContent=T.wbwLabel; wrap.appendChild(l1);
  const gb=document.createElement('div'); gb.className='interlinear';
  q.verses.forEach((v,vi)=>{
    v.forEach(([ar,gl])=>{
      const d=document.createElement('div'); d.className='iword';
      d.innerHTML=`<span class="ar"></span><span class="gl"></span>`;
      d.querySelector('.ar').textContent=fixQ(ar); d.querySelector('.gl').textContent=L(gl);
      gb.appendChild(d);
    });
    if(q.numbered){ const n=document.createElement('span'); n.className='iverse'; n.textContent=`﴿${AR_NUM(q.firstAyah+vi)}﴾`; gb.appendChild(n); }
  });
  wrap.appendChild(gb);
  const l2=document.createElement('span'); l2.className='after-label'; l2.textContent=T.trLabel; wrap.appendChild(l2);
  const tr=document.createElement('div'); tr.className='trans';
  q.tr.forEach((t,i)=>{
    const p=document.createElement('div');
    if(q.numbered){ const n=document.createElement('span'); n.className='vn'; n.textContent=(q.firstAyah+i)+'.'; p.appendChild(n); }
    p.appendChild(document.createTextNode(L(t))); tr.appendChild(p);
  });
  wrap.appendChild(tr);
  return wrap;
}

function nextQuestion(){
  if(state.current < state.steps.length-1){ state.current++; renderStep(); }
  else showResults();
}

function finishQuiz(){
  const max = state.steps.length;
  const score = state.steps.filter(s=>s.right).length;
  const pct = Math.round(score/max*100);
  const details = state.steps.slice().sort((a,b)=>a.q.n-b.q.n).map(s=>`Q${s.q.n}: ${s.right?1:0}/1`).join('; ');
  state.result = {score, max, pct};
  const payload = {
    name:state.name, className:state.cls, level:"",
    score, scoreMax:max, percentage:pct, details,
    submittedAt:new Date().toLocaleString('en-SG')
  };
  Object.assign(payload, RESULTS_SHEET, {ref:"main", columns:[
    ["Name", payload.name], ["Class", payload.className], ["Level", payload.level],
    ["Score", payload.score], ["Out of", payload.scoreMax], ["Percentage", payload.percentage+"%"],
    ["Per-question breakdown", payload.details], ["Timestamp (submitted)", payload.submittedAt]
  ]});
  state.payload = payload;
  submitResults(payload);
}

function submitResults(payload){
  const st=$('submitStatus'); st.className='status-line'; st.textContent=T.submitting;
  $('retrySubmitBtn').classList.add('hidden');
  fetch(SHEET_WEBAPP_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)})
    .then(()=>{ st.className='status-line ok'; st.textContent=T.submitted; })
    .catch(()=>{ st.className='status-line err'; st.textContent=T.submitFail; $('retrySubmitBtn').classList.remove('hidden'); });
}

function showResults(){
  const {score, max, pct} = state.result;
  $('scorePct').textContent = pct+'%';
  $('scorePts').textContent = T.points(score, max);
  const list=$('reviewList'); list.innerHTML='';
  state.steps.slice().sort((a,b)=>a.q.n-b.q.n).forEach(s=>{
    const d=document.createElement('div'); d.className='review-item '+(s.right?'ok':'no');
    d.innerHTML=`<span class="mark">${s.right?'✓':'✗'}</span><span></span>`;
    d.lastChild.textContent = `${s.q.n}. ${L(s.q.prompt)}`;
    list.appendChild(d);
  });
  show('screen-result');
}
</script>
