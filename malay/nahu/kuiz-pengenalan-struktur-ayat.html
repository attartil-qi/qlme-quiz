<!DOCTYPE html>
<html lang="ms" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuiz Nahu — Pengenalan Struktur Ayat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  .brand-logo{display:block;width:96px;height:96px;margin:0 auto 12px;}
  /* Show the logo on the landing and results screens; hide it during questions to save space on phones */
  body:has(#quizScreen:not(.hidden)) .brand-logo{display:none;}
  @font-face{
    /* KFGQPC Uthmanic Script HAFS — the official Madinah Mushaf font, built
       from the authoritative Uthmani text, so every diacritic combination
       (including rare triple-stacks) is pre-shaped correctly. Used as the
       primary Arabic font since this page is hosted on a real domain
       (GitHub Pages) with no restrictions on loading third-party fonts. */
    font-family:'KFGQPC Uthmanic Script HAFS';
    src:url('https://cdn.jsdelivr.net/gh/thetruetruth/quran-data-kfgqpc@main/hafs/font/hafs.18.woff2') format('woff2'),
        url('https://cdn.jsdelivr.net/gh/thetruetruth/quran-data-kfgqpc@main/hafs/font/hafs.18.ttf') format('truetype');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
  }
  :root{
    --parchment:#faf5e6; --parchment-deep:#f2ead4;
    --teal:#1f7a72; --teal-dark:#155c56;
    --gold:#b8912f; --gold-light:#e8d8a8;
    --emerald:#0d3b34;
    --correct:#2e7d46; --correct-bg:#e5f3e8;
    --incorrect:#a33636; --incorrect-bg:#fbe9e7;
    --shadow: 0 4px 18px rgba(13,59,52,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Lora', serif;background:linear-gradient(180deg, var(--parchment) 0%, var(--parchment-deep) 100%);color:var(--emerald);min-height:100vh;padding:20px 14px 60px;}
  .wrap{max-width:760px;margin:0 auto;}
  .arabic{font-family:'KFGQPC Uthmanic Script HAFS','Scheherazade New','Amiri', serif;}
  header.top{text-align:center;padding:22px 18px 26px;border-bottom:3px solid var(--gold);margin-bottom:22px;}
  header.top h1{color:var(--emerald);font-size:1.6rem;margin:0 0 6px;letter-spacing:0.3px;}
  header.top .root-badge{display:inline-block;font-family:'KFGQPC Uthmanic Script HAFS','Scheherazade New','Amiri',serif;font-size:1.7rem;color:var(--teal-dark);background:#fff;border:2px solid var(--gold);border-radius:12px;padding:6px 22px;margin-top:6px;box-shadow:var(--shadow);}
  header.top p.sub{color:#5b6b63;font-size:0.95rem;margin-top:10px;}
  .card{background:#fffdf8;border:1px solid var(--gold-light);border-radius:14px;box-shadow:var(--shadow);padding:22px 22px 24px;margin-bottom:18px;}
  #intro .stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:18px 0;}
  #intro .stat{background:var(--parchment-deep);border:1px solid var(--gold-light);border-radius:10px;padding:10px 16px;text-align:center;min-width:110px;}
  #intro .stat b{display:block;color:var(--teal-dark);font-size:1.3rem;}
  #intro .stat span{font-size:0.78rem;color:#5b6b63;}
  .student-info{display:flex;flex-direction:column;gap:14px;max-width:320px;margin:20px auto 4px;}
  .student-info label{text-align:left;font-size:0.82rem;font-weight:700;color:var(--emerald);text-transform:uppercase;letter-spacing:0.4px;}
  .student-info input[type="text"]{display:block;width:100%;margin-top:5px;padding:10px 12px;border:1.5px solid var(--gold-light);border-radius:8px;font-family:'Lora',serif;font-size:0.95rem;color:var(--emerald);background:#fff;}
  .student-info input[type="text"]:focus{outline:none;border-color:var(--teal);}
  .submit-status{text-align:center;font-size:0.85rem;color:#5b6b63;margin:4px 0 18px;min-height:20px;}
  .submit-status.ok{color:var(--correct);font-weight:600;}
  .submit-status.warn{color:#96721f;font-weight:600;}
  .btn{display:inline-block;background:var(--teal);color:#fff;border:none;border-radius:10px;padding:13px 26px;font-family:'Lora',serif;font-size:1rem;font-weight:600;cursor:pointer;transition:background .15s ease, transform .1s ease;}
  .btn:hover{background:var(--teal-dark);}
  .btn:active{transform:scale(0.98);}
  .btn.gold{background:var(--gold);}
  .btn.gold:hover{background:#96721f;}
  .btn:disabled{background:#ccc;cursor:not-allowed;}
  .btn-row{text-align:center;margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .progress-wrap{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-size:0.85rem;color:var(--teal-dark);font-weight:600;}
  .progress-bar{flex:1;height:8px;background:var(--parchment-deep);border-radius:6px;overflow:hidden;border:1px solid var(--gold-light);}
  .progress-fill{height:100%;background:linear-gradient(90deg, var(--gold), var(--teal));transition:width .3s ease;}
  .ayah-ref{font-size:0.82rem;color:var(--gold);font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:8px;}
  .ayah-box{direction:rtl;font-family:'KFGQPC Uthmanic Script HAFS','Scheherazade New','Amiri', serif;font-size:1.85rem;line-height:2.5;text-align:center;color:var(--emerald);background:var(--parchment-deep);border:1px solid var(--gold-light);border-radius:10px;padding:18px 14px;margin-bottom:10px;}
  .ayah-box .focus{color:var(--teal-dark);border-bottom:3px dotted var(--gold);padding-bottom:2px;}
  .gloss-title{font-size:0.78rem;text-transform:uppercase;letter-spacing:0.5px;color:#5b6b63;margin:4px 0 8px;font-weight:700;}
  .gloss-table{display:flex;flex-wrap:wrap;gap:8px;direction:rtl;margin-bottom:14px;}
  .gloss-item{background:#fff;border:1px solid var(--gold-light);border-radius:8px;padding:6px 10px;text-align:center;min-width:64px;}
  .gloss-item.in-focus{border-color:var(--teal);background:#eef7f6;}
  .gloss-item .ar{font-family:'KFGQPC Uthmanic Script HAFS','Scheherazade New','Amiri',serif;font-size:1.2rem;color:var(--emerald);}
  .gloss-item .tr{font-size:0.72rem;color:#6a7a72;direction:ltr;margin-top:2px;}
  .full-tr{background:#fff;border-left:4px solid var(--teal);border-radius:0 8px 8px 0;padding:10px 14px;font-size:0.92rem;font-style:italic;color:#3f4e47;margin-bottom:12px;}
  .full-tr small{display:block;font-style:normal;font-size:0.72rem;color:#8a9990;margin-top:4px;}
  .focus-note{font-size:0.82rem;color:#6a7a72;text-align:center;margin:0 0 16px;}
  /* Formula reminder */
  details.formula{background:#fff;border:1.5px dashed var(--gold);border-radius:10px;padding:8px 14px;margin-bottom:18px;font-size:0.88rem;}
  details.formula summary{cursor:pointer;font-weight:700;color:var(--teal-dark);}
  .formula-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px;}
  .formula-row{background:var(--parchment-deep);border-radius:8px;padding:8px 12px;}
  .formula-row b{color:var(--emerald);}
  .formula-row .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .chip{background:#fff;border:1px solid var(--gold-light);border-radius:20px;padding:3px 10px;font-size:0.8rem;}
  .chip i{font-style:normal;color:var(--gold);font-weight:700;margin-right:4px;}
  .part{margin-bottom:22px;}
  .part-label{font-weight:700;color:var(--emerald);margin-bottom:4px;font-size:0.98rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .part-sub{font-size:0.82rem;color:#6a7a72;margin-bottom:10px;}
  .part-label .tag{background:var(--teal);color:#fff;font-size:0.68rem;padding:2px 8px;border-radius:20px;letter-spacing:0.4px;text-transform:uppercase;}
  .part-label .tag.free{background:var(--gold);}
  .options{display:flex;flex-direction:column;gap:8px;}
  .option{border:1.5px solid var(--gold-light);background:#fff;border-radius:9px;padding:11px 14px;cursor:pointer;font-size:0.96rem;display:flex;align-items:center;gap:10px;transition:border-color .15s, background .15s;}
  .option:hover{border-color:var(--teal);}
  .option input{accent-color:var(--teal);flex-shrink:0;}
  .option .opt-ar{font-size:1.35rem;line-height:1.7;}
  .option.correct{background:var(--correct-bg);border-color:var(--correct);color:var(--correct);font-weight:600;}
  .option.incorrect{background:var(--incorrect-bg);border-color:var(--incorrect);color:var(--incorrect);font-weight:600;}
  .option.locked{cursor:default;}
  .explain{margin-top:10px;background:var(--parchment-deep);border-left:4px solid var(--gold);padding:10px 14px;border-radius:0 8px 8px 0;font-size:0.88rem;color:#3f4e47;display:none;line-height:1.55;}
  .explain.show{display:block;}
  .explain .arabic{font-size:1.15rem;}
  .q-arabic{display:block;direction:rtl;text-align:center;font-family:'KFGQPC Uthmanic Script HAFS','Scheherazade New','Amiri',serif;font-size:1.35rem;line-height:2;color:var(--teal-dark);background:var(--parchment-deep);border:1px solid var(--gold-light);border-radius:8px;padding:6px 12px;margin:6px 0 10px;}
  textarea.reflect{width:100%;min-height:130px;padding:12px;border:1.5px solid var(--gold-light);border-radius:9px;font-family:'Lora',serif;font-size:0.95rem;color:var(--emerald);background:#fff;resize:vertical;}
  textarea.reflect:focus{outline:none;border-color:var(--teal);}
  .no-marks{font-size:0.8rem;color:#96721f;margin-bottom:8px;}
  #results .score-circle{width:150px;height:150px;border-radius:50%;border:10px solid var(--gold-light);display:flex;align-items:center;justify-content:center;flex-direction:column;margin:10px auto 20px;background:#fff;}
  #results .score-circle b{font-size:2.1rem;color:var(--teal-dark);}
  #results .score-circle span{font-size:0.78rem;color:#5b6b63;}
  .review-item{border-bottom:1px solid var(--gold-light);padding:10px 0;font-size:0.9rem;}
  .review-item .ref{color:var(--gold);font-weight:700;}
  .review-item .status-ok{color:var(--correct);font-weight:700;}
  .review-item .status-bad{color:var(--incorrect);font-weight:700;}
  .hidden{display:none !important;}
  footer{text-align:center;color:#8a9990;font-size:0.78rem;margin-top:30px;}
</style>
</head>

let quiz = [], current = 0, answers = [], checked = false;
let studentName = "", studentClass = "", lastSubmitPayload = null;

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function buildOptionShuffle(optsArr, correctIdx){
  const order = shuffleArr(optsArr.map((_,i)=>i));
  return {order, newCorrect: order.indexOf(correctIdx)};
}

function applyUI(){
  document.title = T.title;
  document.getElementById('uiTitle').textContent = T.title;
  document.getElementById('uiSub').innerHTML = T.sub;
  document.getElementById('uiIntro').innerHTML = T.intro;
  document.getElementById('uiStatQ').textContent = T.statQ;
  document.getElementById('uiStatPts').textContent = T.statPts;
  document.getElementById('uiStatShuffle').textContent = T.statShuffle;
  document.getElementById('uiNameLabel').textContent = T.nameLabel;
  document.getElementById('uiClassLabel').textContent = T.classLabel;
  document.getElementById('studentName').placeholder = T.namePh;
  document.getElementById('studentClass').placeholder = T.classPh;
  document.getElementById('beginBtn').textContent = T.beginQuiz;
  document.getElementById('checkBtn').textContent = T.checkAnswers;
  document.getElementById('nextBtn').textContent = T.nextQuestion;
  document.getElementById('retryBtn').textContent = T.retry;
  document.getElementById('homeBtn').textContent = T.home;
}

function startQuiz(){
  const nameVal = document.getElementById('studentName').value.trim();
  const classVal = document.getElementById('studentClass').value.trim();
  if(!nameVal || !classVal){ alert(T.needInfo); return; }
  studentName = nameVal; studentClass = classVal;
  quiz = [...shuffleArr(BANK), FINAL_Q].map(q=>({
    ...q, shuf: q.parts.map(p=>buildOptionShuffle(p.opts, p.correct)), _earned:0, _max:q.parts.length
  }));
  current = 0;
  answers = quiz.map(q=>({choice:q.parts.map(()=>null), reflection:""}));
  lastSubmitPayload = null;
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('results').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  renderQuestion();
}

function goToIntro(){
  document.getElementById('results').classList.add('hidden');
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('intro').classList.remove('hidden');
}

function formulaHtml(){
  return `<details class="formula"><summary>${T.formulaTitle}</summary>
    <div class="formula-grid">
      <div class="formula-row"><b>${T.fIsm}</b>
        <div class="chips"><span class="chip"><i>A</i>Mubtada' مُبْتَدَأ</span><span class="chip"><i>B</i>Khabar خَبَر</span><span class="chip"><i>C</i>Mutaalliq bil Khabar</span></div></div>
      <div class="formula-row"><b>${T.fFil}</b>
        <div class="chips"><span class="chip"><i>A</i>Fe'il فِعْل</span><span class="chip"><i>B</i>Faail فَاعِل</span><span class="chip"><i>C</i>Maf'ul مَفْعُول / Mutaalliq bil Fe'il</span></div></div>
    </div></details>`;
}

function renderQuestion(){
  checked = false;
  const q = quiz[current];
  document.getElementById('qCounter').textContent = `${T.question} ${current+1} ${T.of} ${quiz.length}`;
  document.getElementById('progressFill').style.width = `${((current+1)/quiz.length)*100}%`;

  const ayahHtml = q.focus ? q.ayah.replace(q.focus, `<span class="focus">${q.focus}</span>`) : q.ayah;
  let html = `<div class="ayah-ref">Sūrah ${q.surah} — ${q.ref}${q.final?' · Tadabbur':''}</div>
    <div class="ayah-box">${ayahHtml}</div>`;
  const toks = q.ayah.split(' ');
  const focusToks = q.focus ? q.focus.split(' ') : [];
  const fStart = q.focus ? toks.findIndex((_,i)=>toks.slice(i,i+focusToks.length).join(' ')===q.focus) : -1;
  html += `<div class="gloss-title">${T.wbwTitle}</div><div class="gloss-table">` +
    toks.map((w,i)=>`<div class="gloss-item${(fStart>-1 && i>=fStart && i<fStart+focusToks.length)?' in-focus':''}"><div class="ar">${w}</div><div class="tr">${t(q.wbw[i])}</div></div>`).join('') + `</div>`;
  html += `<div class="full-tr">${t(q.tr)}<small>${T.trSource} · ${T.wbwSource}</small></div>`;
  html += q.focus ? `<p class="focus-note">${T.focusNote}</p>` : `<p class="focus-note">${t(q.intro)}</p>`;
  html += formulaHtml();

  q.parts.forEach((p,pi)=>{
    const label = p.key ? T.partLabels[p.key] : t(p.label);
    const opts = q.shuf[pi].order.map((origIdx,pos)=>`
      <label class="option" data-pos="${pos}">
        <input type="radio" name="p${pi}" value="${pos}" ${answers[current].choice[pi]===pos?'checked':''} onchange="selectOption(${pi},${pos})">
        <span>${t(p.opts[origIdx])}</span>
      </label>`).join('');
    html += `<div class="part">
      <div class="part-label"><span class="tag">Bahagian ${pi+1}</span>${label}</div>
      ${p.arabic ? `<div class="q-arabic">${p.arabic}</div>` : ''}
      <div class="options" id="opts${pi}">${opts}</div>
      <div class="explain" id="explain${pi}">${t(p.note)}</div>
    </div>`;
  });

  if(q.reflection){
    html += `<div class="part">
      <div class="part-label"><span class="tag free">${T.reflectTag}</span>${t(q.reflection)}</div>
      <div class="no-marks">${T.noMarks}</div>
      <textarea class="reflect" id="reflectBox" placeholder="${T.reflectPh}" oninput="answers[current].reflection=this.value">${answers[current].reflection}</textarea>
    </div>`;
  }

  document.getElementById('questionCard').innerHTML = html;
  document.getElementById('checkBtn').classList.remove('hidden');
  document.getElementById('checkBtn').disabled = false;
  document.getElementById('nextBtn').classList.add('hidden');
  document.getElementById('nextBtn').textContent = (current === quiz.length-1) ? T.seeResults : T.nextQuestion;
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectOption(pi, pos){ if(!checked) answers[current].choice[pi] = pos; }

function checkAnswers(){
  const q = quiz[current];
  if(answers[current].choice.some(c=>c===null)){ alert(T.answerAll); return; }
  checked = true;
  let pts = 0;
  q.parts.forEach((p,pi)=>{
    const chosen = answers[current].choice[pi];
    const right = q.shuf[pi].newCorrect;
    document.querySelectorAll(`#opts${pi} .option`).forEach((el,pos)=>{
      el.classList.add('locked');
      el.querySelector('input').disabled = true;
      if(pos === right) el.classList.add('correct');
      else if(pos === chosen) el.classList.add('incorrect');
    });
    document.getElementById(`explain${pi}`).classList.add('show');
    if(chosen === right) pts++;
  });
  q._earned = pts;
  const rb = document.getElementById('reflectBox');
  if(rb){ answers[current].reflection = rb.value; rb.readOnly = true; }
  document.getElementById('checkBtn').disabled = true;
  document.getElementById('nextBtn').classList.remove('hidden');
  /* Auto-submit the moment the last question is checked */
  if(current === quiz.length-1) buildAndSubmit();
}

function nextQuestion(){
  if(current < quiz.length-1){ current++; renderQuestion(); }
  else showResults();
}

function totals(){
  const score = quiz.reduce((s,q)=>s+q._earned,0);
  const max = quiz.reduce((s,q)=>s+q._max,0);
  return {score, max, pct: max ? Math.round(score/max*100) : 0};
}

function buildAndSubmit(){
  const {score, max, pct} = totals();
  const finalIdx = quiz.length-1;
  lastSubmitPayload = {
    name: studentName, className: studentClass, level: "",
    score, scoreMax: max, percentage: pct,
    details: quiz.map(q=>`${q.ref} (${q._earned}/${q._max})`).join('; '),
    reflection: (answers[finalIdx].reflection || "").trim(),
    submittedAt: new Date().toISOString()
  };
  submitResult(lastSubmitPayload);
}

function showResults(){
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');
  const {score, max, pct} = totals();
  document.getElementById('resultsHeading').textContent = `${T.wellDone}, ${studentName}!`;
  document.getElementById('scorePct').textContent = pct+'%';
  document.getElementById('scoreFrac').textContent = `${score} / ${max} ${T.points}`;
  document.getElementById('reviewList').innerHTML = quiz.map((q,i)=>{
    const full = q._earned === q._max;
    return `<div class="review-item"><span class="ref">${i+1}. Sūrah ${q.surah} ${q.ref}</span>
      — <span class="arabic">${q.focus || 'Tadabbur'}</span>
      — <span class="${full?'status-ok':'status-bad'}">${q._earned}/${q._max}</span></div>`;
  }).join('');
  window.scrollTo({top:0, behavior:'smooth'});
}

async function submitResult(data){
  const statusEl = document.getElementById('submitStatus');
  if(!SHEET_WEBAPP_URL || SHEET_WEBAPP_URL.indexOf('PASTE_YOUR') !== -1){
    statusEl.className = 'submit-status warn'; statusEl.textContent = T.notSetUp; return;
  }
  statusEl.className = 'submit-status'; statusEl.textContent = T.submitting;
  try{
    await fetch(SHEET_WEBAPP_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(data)});
    statusEl.className = 'submit-status ok'; statusEl.textContent = T.submitted;
  }catch(err){
    statusEl.className = 'submit-status warn';
    statusEl.innerHTML = `${T.failed} <button class="btn gold" style="padding:5px 12px;font-size:0.78rem;" onclick="retrySubmit()">${T.retrySubmit}</button>`;
  }
}
function retrySubmit(){ if(lastSubmitPayload) submitResult(lastSubmitPayload); }

applyUI();
</script>
</body>
</html>
