<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuiz Fe'il Mudhorie'</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'UthmanicHafs';src:local('KFGQPC Uthmanic Script HAFS'),local('KFGQPC Uthmanic Script HAFS Regular'),url('https://cdn.jsdelivr.net/gh/mustafa0x/qpc-fonts@f93bf5f3/various-woff2/UthmanicHafs1%20Ver09.woff2') format('woff2'),url('https://raw.githubusercontent.com/mustafa0x/qpc-fonts/f93bf5f3/various-woff2/UthmanicHafs1%20Ver09.woff2') format('woff2');font-display:swap}
:root{--parchment:#faf5e6;--parchment2:#f2ead4;--teal:#1f7a72;--teal-d:#155c56;--gold:#b8912f;--gold-l:#e8d8a8;--em:#0d3b34;--ok:#2e7d46;--ok-bg:#e5f3e8;--bad:#a33636;--bad-bg:#fbe9e7;--card:#fffdf8}
*{box-sizing:border-box}
body{margin:0;font-family:'Lora',Georgia,serif;color:var(--em);background:linear-gradient(180deg,var(--parchment),var(--parchment2));min-height:100vh;line-height:1.55}
.arabic{font-family:'UthmanicHafs','Amiri',serif}.arabic.na{font-family:'Amiri','Noto Naskh Arabic',serif}
bdi.arabic{font-size:1.25em}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 40px}
header.top{text-align:center;padding:10px 0 6px}
.brand-logo{display:block;width:96px;height:96px;margin:0 auto 12px;border-radius:50%}
body:has(#quizScreen:not(.hidden)) .brand-logo{display:none}
h1{margin:4px 0;font-size:1.55rem;color:var(--em)}
.badge{display:inline-block;background:var(--gold-l);color:var(--em);border-radius:20px;padding:2px 14px;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--gold-l);border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 4px 14px rgba(13,59,52,.09)}
.hidden{display:none!important}
label.f{display:block;font-weight:600;margin:12px 0 4px}
input[type=text]{width:100%;padding:10px 12px;font:inherit;border:1px solid var(--gold);border-radius:8px;background:#fff}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 22px;background:var(--teal);color:#fff;font-weight:600;margin-top:14px}
button:hover{background:var(--teal-d)}button:disabled{opacity:.45;cursor:not-allowed}
button.alt{background:#fff;color:var(--teal-d);border:1px solid var(--teal)}
.err{color:var(--bad);min-height:1.2em;margin-top:8px}
.bar{height:8px;background:var(--gold-l);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .3s}
.pc{font-size:.85rem;margin:6px 0 0;text-align:right}
.ref{font-size:.9rem;color:var(--gold);font-weight:600;margin-bottom:4px}
.mrow{display:flex;gap:10px;align-items:center;margin:8px 0;padding:8px 12px;border:1px solid var(--gold-l);border-radius:10px;background:#fff}.mrow .arabic{font-size:1.5rem;min-width:70px;text-align:center}.mrow select{flex:1;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--gold-l);background:#fffdf8}.mrow.ok{background:var(--ok-bg);border-color:var(--ok)}.mrow.bad{background:var(--bad-bg);border-color:var(--bad)}.mrow .lbl{min-width:70px;font-weight:600}.mrow .lbl .arabic{font-size:1.4rem}.mrow .corr{font-size:.8rem;color:var(--ok)}
.q{font-size:1.08rem;font-weight:600;margin:6px 0 12px}.hint{font-size:.85rem;font-style:italic;margin:-6px 0 10px}
.ayah{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:flex-start;background:var(--parchment);border:1px solid var(--gold-l);border-radius:10px;padding:12px;margin-bottom:14px}
.tok{text-align:center;min-width:36px}.tok .ar{display:block;font-size:1.7rem;line-height:1.9}
.tok .gl{display:block;font-size:.72rem;color:var(--teal-d);max-width:110px}
.tok.boxed .ar{border:2px solid var(--bad);border-radius:6px;padding:0 6px}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--gold-l);background:#fff;border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt .ot{flex:1}.opt .ot.arabic{font-size:1.5rem}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}.opt.miss{border:2px dashed var(--ok);background:var(--ok-bg)}.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.fb{margin-top:12px;padding:12px;border-radius:10px;font-size:.95rem}.fb.ok{background:var(--ok-bg);color:var(--ok)}.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb b{display:block;margin-bottom:4px}.wbw{margin-top:8px;color:var(--em);font-size:.9rem;line-height:2}.wbw b{display:inline;color:var(--em)}.wbw .arabic{font-size:1.3rem}.wbw summary{cursor:pointer;font-weight:700;color:var(--em)}.wbw summary:hover{text-decoration:underline}.fb span{color:var(--em)}
.circle{width:150px;height:150px;border-radius:50%;border:8px solid var(--teal);margin:10px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff}
.circle b{font-size:2rem}.rl{list-style:none;padding:0;margin:12px 0}.rl li{padding:8px 10px;border-bottom:1px solid var(--gold-l);display:flex;justify-content:space-between}
.pass{color:var(--ok);font-weight:600}.fail{color:var(--bad);font-weight:600}.status{text-align:center;font-size:.9rem;min-height:1.3em}
footer{text-align:center;font-size:.85rem;color:var(--teal-d);margin-top:24px}
</style>
</head>

{"id":8,"p":"رَزَقَ ialah fe'il madhi yang bermaksud \"Dia telah memberi rezeki\". Tukarkan perkataan ini kepada bentuk \"Kami memberi rezeki\".","o":[{"ar":"نَرۡزُقُ"},{"ar":"يَرۡزُقُ"},{"ar":"تَرۡزُقُ"},{"ar":"أَرۡزُقُ"}],"c":[0],"n":"Fe'il mudhorie' bagi نَحْنُ (kami) bermula dengan huruf ن: نَرۡزُقُ. Pilihan lain salah: يَرۡزُقُ = dia memberi rezeki (huruf يـ); تَرۡزُقُ = kamu memberi rezeki (atau dia muannas memberi rezeki) (huruf تـ); أَرۡزُقُ = aku memberi rezeki (huruf أـ)."},

{"id":10,"r":"Surah al-Mursalat, 77:20","a":A10,"bm":["Bukankah Kami telah menciptakan kamu dari air (benih) yang sedikit dipandang orang?"],"p":"Terjemahkan fe'il yang berkotak dalam ayat ini.","o":["Aku menciptakan kamu semua","Dia menciptakan mereka","Kami menciptakan kamu semua","Aku menciptakan mereka"],"c":[2],"n":"نَخۡلُقۡكُمۡ = نَخْلُقُ (kami menciptakan; huruf نـ) + كُمْ (kamu semua). Pilihan lain salah: \"aku\" memerlukan huruf أـ dan \"dia\" memerlukan huruf يـ; \"mereka\" pula ialah هُمْ, bukan كُمْ."}

const $ = id => document.getElementById(id);
let order = [], cur = 0, res = [], status = "", payload = null;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function show(id){ ["landing","quizScreen","results"].forEach(s => $(s).classList.toggle("hidden", s !== id)); window.scrollTo(0,0); }

function init(){
  document.documentElement.lang = QUIZ_LANGUAGE;
  document.title = t("title"); $("title").textContent = t("title"); $("badge").textContent = t("badge");
  $("intro").textContent = t("intro"); $("nameL").textContent = t("nameL"); $("clsL").textContent = t("classL");
  $("cls").placeholder = t("classPh"); $("beginBtn").textContent = t("begin"); $("resTitle").textContent = t("resTitle");
  $("againBtn").textContent = t("again"); $("retrySub").textContent = t("retry");
  $("beginBtn").onclick = start; $("againBtn").onclick = start; $("retrySub").onclick = submit;
}

function start(){
  const n = $("name").value.trim(), c = $("cls").value.trim();
  if (!n || !c){ $("err").textContent = t("required"); show("landing"); return; }
  $("err").textContent = "";
  order = Q.slice(0,2).concat(shuffle(Q.slice(2))).map(q => ({q, opts: (q.m || q.mp) ? [] : q.ns ? q.o.map((o,i)=>({o,i})) : shuffle(q.o.map((o,i)=>({o,i})))}));
  cur = 0; res = []; status = ""; payload = null; show("quizScreen"); render();
}

function ayahHTML(q, revealed){
  return '<div class="ayah" dir="rtl" id="ayah">' + q.a.map(k => {
    const g = (k[3] && !revealed) ? (k[4] || "?") : k[2];
    return '<div class="tok' + (k[3] === 1 ? ' boxed' : '') + '"><span class="ar arabic">' + k[0] + '</span>' + (q.nowbw ? '' : '<span class="gl">' + g + '</span>') + '</div>';
  }).join("") + '</div>';
}

function render(){
  const {q, opts} = order[cur], multi = q.c.length > 1;
  $("prog").style.width = (cur / order.length * 100) + "%";
  $("pcount").textContent = t("qOf").replace("{n}", cur + 1).replace("{t}", order.length);
  $("qcard").innerHTML =
    (q.r ? '<div class="ref">' + T(q.r) + '</div>' : '') + (q.a ? ayahHTML(q, false) : '') +
    '<div class="q">' + AR(T(q.p)) + '</div>' + (multi ? '<div class="hint">' + t("multi") + '</div>' : '') +
    '<div id="opts">' + opts.map(x => '<label class="opt" data-i="' + x.i + '"><input type="' + (multi ? 'checkbox' : 'radio') + '" name="o" value="' + x.i + '"><span class="ot' + (x.o.ar ? ' arabic' + (x.o.na ? ' na' : '') : '') + '">' + (x.o.ar || AR(T(x.o))) + '</span></label>').join("") + '</div>' +
    '<div id="fb"></div><button id="chk" disabled>' + t("check") + '</button> <button id="nxt" class="hidden">' + (cur === order.length - 1 ? t("see") : t("next")) + '</button>';
  document.querySelectorAll("input[name=o]").forEach(i => i.onchange = () => $("chk").disabled = !document.querySelector("input[name=o]:checked"));
  if (q.m) setupMatch(q);
  if (q.mp) setupMP(q);
  $("chk").onclick = check; $("nxt").onclick = () => { if (cur === order.length - 1) showResults(); else { cur++; render(); } };
}

const P1 = r => r.pts !== undefined ? r.pts : (r.ok ? 1 : 0), M1 = r => r.max || 1;
function setupMP(q){
  $("opts").innerHTML = q.mp.map((x,i) => '<div class="mrow" id="mr' + i + '"><span class="lbl">' + AR(x[0]) + '</span><select data-i="' + i + '"><option value="">— pilih —</option>' + x[1].map(m => '<option value="' + m + '">' + m + '</option>').join("") + '</select><span class="corr"></span></div>').join("");
  document.querySelectorAll("#opts select").forEach(sl => sl.onchange = () => $("chk").disabled = [...document.querySelectorAll("#opts select")].some(x => !x.value));
}
function checkMP(q){
  let pts = 0;
  q.mp.forEach((x,i) => {
    const sl = document.querySelector('#opts select[data-i="' + i + '"]'), r = $("mr" + i), want = x[1][x[2]], good = sl.value === want;
    sl.disabled = true; if (good) pts++; r.classList.add(good ? "ok" : "bad");
    if (!good) r.querySelector(".corr").textContent = "✓ " + want;
  });
  const ok = pts === q.mp.length;
  res.push({id: q.id, ok, pts, max: q.mp.length});
  $("fb").innerHTML = '<div class="fb ' + (ok ? 'ok' : 'bad') + '"><b>' + (ok ? t("right") : t("wrong")) + ' (' + pts + '/' + q.mp.length + ')</b><span>' + AR(T(q.n)) + '</span></div>';
  $("chk").classList.add("hidden"); $("nxt").classList.remove("hidden");
  if (cur === order.length - 1) finish();
}
function setupMatch(q){
  const ms = shuffle(q.m.map(x => x[1]));
  $("opts").innerHTML = q.m.map((x,i) => '<div class="mrow" id="mr' + i + '"><span class="arabic" dir="rtl">' + x[0] + '</span><select data-i="' + i + '"><option value="">— pilih —</option>' + ms.map(m => '<option value="' + m + '">' + m + '</option>').join("") + '</select><span class="corr"></span></div>').join("");
  document.querySelectorAll("#opts select").forEach(sl => sl.onchange = () => $("chk").disabled = [...document.querySelectorAll("#opts select")].some(x => !x.value));
}
function checkMatch(q){
  let pts = 0;
  q.m.forEach((x,i) => {
    const sl = document.querySelector('#opts select[data-i="' + i + '"]'), r = $("mr" + i), good = sl.value === x[1];
    sl.disabled = true; if (good) pts++; r.classList.add(good ? "ok" : "bad");
    if (!good) r.querySelector(".corr").textContent = "✓ " + x[1];
  });
  const ok = pts === q.m.length;
  res.push({id: q.id, ok, pts, max: q.m.length});
  $("fb").innerHTML = '<div class="fb ' + (ok ? 'ok' : 'bad') + '"><b>' + (ok ? t("right") : t("wrong")) + ' (' + pts + '/' + q.m.length + ')</b><span>' + AR(T(q.n)) + '</span></div>';
  $("chk").classList.add("hidden"); $("nxt").classList.remove("hidden");
  if (cur === order.length - 1) finish();
}
function check(){
  const {q} = order[cur];
  if (q.m) return checkMatch(q);
  if (q.mp) return checkMP(q);
  const sel = [...document.querySelectorAll("input[name=o]:checked")].map(x => +x.value);
  const ok = sel.length === q.c.length && q.c.every(i => sel.includes(i));
  res.push({id: q.id, ok});
  document.querySelectorAll(".opt").forEach(l => {
    const i = +l.dataset.i; l.querySelector("input").disabled = true;
    if (q.c.includes(i)) l.classList.add(sel.includes(i) ? "ok" : "miss"); else if (sel.includes(i)) l.classList.add("bad");
  });
  if (q.a) $("ayah").outerHTML = ayahHTML(q, true);
  const wbw = q.nowbw ? '<details class="wbw"><summary>Klik untuk melihat terjemahan perkataan demi perkataan</summary><div>' + q.a.filter(k => k[2]).map(k => '<span class="arabic" dir="rtl">' + k[0] + '</span> = ' + k[2]).join(' · ') + '</div></details>' : '';
  $("fb").innerHTML = '<div class="fb ' + (ok ? 'ok' : 'bad') + '"><b>' + (ok ? t("right") : t("wrong")) + '</b><span>' + AR(T(q.n)) + '</span>' + wbw + (q.bm && q.bm.length ? '<details class="wbw"><summary>Klik untuk melihat terjemahan Sheikh Abdullah Basmeih</summary><div>' + q.bm.join('<br>') + '</div></details>' : '') + '</div>';
  $("chk").classList.add("hidden"); $("nxt").classList.remove("hidden");
  if (cur === order.length - 1) finish();   // auto-submit the moment the last question is checked
}

function finish(){
  const score = res.reduce((a,r) => a + P1(r), 0), max = res.reduce((a,r) => a + M1(r), 0);
  const details = res.slice().sort((a,b) => a.id - b.id).map(r => "Q" + r.id + " (" + P1(r) + "/" + M1(r) + ")").join("; ");
  payload = {name: $("name").value.trim(), className: $("cls").value.trim(), level: "", sheetId: "1FKYnjV2iqx4rwiyifXh9qSwVfBwo0f7GPfj4qjxZi6M", score, scoreMax: max, percentage: Math.round(score / max * 100), details, submittedAt: new Date().toISOString()};
  submit();
}

async function submit(){
  setStatus("submitting");
  if (SHEET_WEBAPP_URL.indexOf("PASTE_YOUR") === 0){ setStatus("notConfigured"); return; }
  try{
    await fetch(SHEET_WEBAPP_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(payload)});
    setStatus("submitted");
  }catch(e){ setStatus("failed"); }
}
function setStatus(k){
  status = k; $("status").textContent = t(k);
  $("retrySub").classList.toggle("hidden", !(k === "failed" || k === "notConfigured"));
}

function showResults(){
  $("pct").textContent = payload.percentage + "%"; $("pts").textContent = payload.score + " / " + payload.scoreMax;
  $("rlist").innerHTML = res.slice().sort((a,b) => a.id - b.id).map(r => '<li><span>' + t("qn") + ' ' + r.id + '</span><span class="' + (r.ok ? 'pass' : 'fail') + '">' + (r.ok ? t("pass") : (P1(r) > 0 ? P1(r) + '/' + M1(r) : t("fail"))) + '</span></li>').join("");
  setStatus(status); show("results");
}
init();
</script>
</body>
