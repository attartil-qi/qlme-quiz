<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuiz Dhomir Muttasil bersama Isim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'UthmanicHafs';src:local('KFGQPC Uthmanic Script HAFS'),local('KFGQPC Uthmanic Script HAFS Regular'),url('https://cdn.jsdelivr.net/gh/mustafa0x/qpc-fonts@f93bf5f3/various-woff2/UthmanicHafs1%20Ver09.woff2') format('woff2'),url('https://raw.githubusercontent.com/mustafa0x/qpc-fonts/f93bf5f3/various-woff2/UthmanicHafs1%20Ver09.woff2') format('woff2');font-display:swap}
:root{--parchment:#faf5e6;--parchment2:#f2ead4;--teal:#1f7a72;--teal-d:#155c56;--gold:#b8912f;--gold-l:#e8d8a8;--em:#0d3b34;--ok:#2e7d46;--ok-bg:#e5f3e8;--bad:#a33636;--bad-bg:#fbe9e7;--card:#fffdf8}
*{box-sizing:border-box}
body{margin:0;font-family:'Lora',Georgia,serif;color:var(--em);background:linear-gradient(180deg,var(--parchment),var(--parchment2));min-height:100vh;line-height:1.55}
.arabic{font-family:'UthmanicHafs','Amiri',serif}
bdi.arabic{font-size:1.25em}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 40px}
header.top{text-align:center;padding:10px 0 6px}
.brand-logo{display:block;width:96px;height:96px;margin:0 auto 12px;border-radius:50%}
body:has(#quizScreen:not(.hidden)) .brand-logo{display:none}
h1{margin:4px 0;font-size:1.55rem;color:var(--em)}
.badge{display:inline-block;background:var(--gold-l);color:var(--em);border-radius:20px;padding:2px 14px;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--gold-l);border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 4px 14px rgba(13,59,52,.09)}
.hidden{display:none!important}
label.f{display:block;font-weight:600;margin:12px 0 4px}
input[type=text]{width:100%;padding:10px 12px;font:inherit;border:1px solid var(--gold);border-radius:8px;background:#fff}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 22px;background:var(--teal);color:#fff;font-weight:600;margin-top:14px}
button:hover{background:var(--teal-d)}button:disabled{opacity:.45;cursor:not-allowed}
button.alt{background:#fff;color:var(--teal-d);border:1px solid var(--teal)}
.err{color:var(--bad);min-height:1.2em;margin-top:8px}
.bar{height:8px;background:var(--gold-l);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .3s}
.pc{font-size:.85rem;margin:6px 0 0;text-align:right}
.ref{font-size:.9rem;color:var(--gold);font-weight:600;margin-bottom:4px}
.q{font-size:1.08rem;font-weight:600;margin:6px 0 12px}.hint{font-size:.85rem;font-style:italic;margin:-6px 0 10px}
.ayah{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:flex-start;background:var(--parchment);border:1px solid var(--gold-l);border-radius:10px;padding:12px;margin-bottom:14px}
.tok{text-align:center;min-width:36px}.tok .ar{display:block;font-size:1.7rem;line-height:1.9}
.tok .gl{display:block;font-size:.72rem;color:var(--teal-d);max-width:110px}
.tok.boxed .ar{border:2px solid var(--bad);border-radius:6px;padding:0 6px}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--gold-l);background:#fff;border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt .ot{flex:1}.opt .ot.arabic{font-size:1.5rem}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}.opt.miss{border:2px dashed var(--ok);background:var(--ok-bg)}.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.fb{margin-top:12px;padding:12px;border-radius:10px;font-size:.95rem}.fb.ok{background:var(--ok-bg);color:var(--ok)}.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb b{display:block;margin-bottom:4px}.fb span{color:var(--em)}
.circle{width:150px;height:150px;border-radius:50%;border:8px solid var(--teal);margin:10px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff}
.circle b{font-size:2rem}.rl{list-style:none;padding:0;margin:12px 0}.rl li{padding:8px 10px;border-bottom:1px solid var(--gold-l);display:flex;justify-content:space-between}
.pass{color:var(--ok);font-weight:600}.fail{color:var(--bad);font-weight:600}.status{text-align:center;font-size:.9rem;min-height:1.3em}
footer{text-align:center;font-size:.85rem;color:var(--teal-d);margin-top:24px}
</style>
</head>

 n:{en:"رَبُّكَ = رَبّ (Lord) + ـكَ (your, singular male).",ms:"رَبُّكَ = رَبّ (Tuhan) + ـكَ (kamu, lelaki tunggal). Terjemahan Sheikh Abdullah Basmeih: 'Tidakkah engkau mengetahui bagaimana Tuhanmu telah melakukan kepada angkatan tentera (yang dipimpin oleh pembawa) Gajah, (yang hendak meruntuhkan Kaabah)?'"}},
{id:5,p:{en:"Which of the following words contains an Isim combined with an attached pronoun?",ms:"Antara perkataan berikut, yang manakah mengandungi isim yang bersambung dengan dhomir muttasil?"},
 h:1,o:[{ar:"عَبْدِهِ"},{ar:"وَإِلَهُكُمْ"},{ar:"مَدْرَسَتِيْ"},{ar:"مَسْجِدُنَا"},{ar:"وَالمُؤْمِنُونَ"}],c:[0,1,2,3],
 n:{en:"عَبْدِهِ = عَبْد + هِ (his); وَإِلَهُكُمْ = إِلَه + كُمْ (your, plural); مَدْرَسَتِي = مَدْرَسَة + ي (my); مَسْجِدُنَا = مَسْجِد + نَا (our). وَالمُؤْمِنُونَ has no attached pronoun: ـونَ is a plural ending, not a pronoun.",
    ms:"عَبْدِهِ = عَبْد + هِ (dia lelaki); وَإِلَهُكُمْ = إِلَه + كُمْ (kamu semua); مَدْرَسَتِي = مَدْرَسَة + ي (saya); مَسْجِدُنَا = مَسْجِد + نَا (kami). وَالمُؤْمِنُونَ tiada dhomir muttasil: ـونَ ialah akhiran jamak, bukan dhomir."}},
{id:6,r:{en:"Surah Al-Mulk, 67:19",ms:"Surah al-Mulk, 67:19"},a:A6,p:{en:"What is the meaning of the boxed word in the following verse?",ms:"Apakah maksud perkataan yang berkotak dalam ayat berikut?"},
 o:[{en:"above them",ms:"di atas mereka"},{en:"above him",ms:"di atas dia"},{en:"above all of you",ms:"di atas kamu semua"},{en:"above both of them",ms:"di atas mereka berdua"}],c:[0],
 n:{en:"فَوْقَهُمْ = فَوْقَ (above) + ـهُمْ (them, plural male). Compare ـهُمَا = both of them, ـكُمْ = all of you, ـهُ = him.",
    ms:"فَوْقَهُمْ = فَوْقَ (di atas) + ـهُمْ (mereka, jamak lelaki). Bandingkan ـهُمَا = mereka berdua, ـكُمْ = kamu semua, ـهُ = dia. Terjemahan Sheikh Abdullah Basmeih: 'Patutkah mereka menutup mata dan tidak memerhatikan (kekuasaan Allah pada) burung-burung yang terbang di atas mereka, (siapakah yang menjaganya ketika) burung-burung itu mengembang dan menutupkan sayapnya?'"}},
{id:7,r:{en:"Surah Al-Mu'minun, 23:44",ms:"Surah al-Mu'minun, 23:44"},a:A7,p:{en:"Complete the meanings of the two dhomir muttasil found in the following verse.",ms:"Lengkapkan maksud bagi dua dhomir muttasil dalam ayat berikut."},
 o:[{en:"our messengers, its messenger",ms:"rasul-rasul kami, rasulnya"},{en:"my messengers, our messenger",ms:"rasul-rasul saya, rasul kami"},{en:"its messengers, your messenger",ms:"rasul-rasulnya, rasul kamu"},{en:"both the messengers, their messenger",ms:"kedua-dua rasul, rasul mereka"}],c:[0],
 n:{en:"رُسُلَنَا = رُسُل (messengers) + نَا (our); رَسُولُهَا = رَسُول (messenger) + هَا (its, referring to the feminine أُمَّة).",
    ms:"رُسُلَنَا = رُسُل (rasul-rasul) + نَا (kami); رَسُولُهَا = رَسُول (rasul) + هَا (dia perempuan, merujuk kepada أُمَّة yang muannath). Terjemahan Sheikh Abdullah Basmeih: 'Kemudian Kami mengutus Rasul-rasul Kami silih berganti. Tiap-tiap kali sesuatu umat didatangi Rasulnya, mereka mendustakannya;'"}},
{id:8,r:{en:"Surah An-Nisa', 4:25",ms:"Surah an-Nisa', 4:25"},a:A8,p:{en:"What is the meaning of the boxed phrase in the following verse?",ms:"Apakah maksud frasa yang berkotak dalam ayat berikut?"},
 o:[{en:"about all of your faith",ms:"dengan keimanan kamu semua"},{en:"about both your faith",ms:"dengan keimanan kamu berdua"},{en:"about his faith",ms:"dengan keimanannya"},{en:"about their faith",ms:"dengan keimanan mereka"}],c:[0],
 n:{en:"بِإِيمَانِكُمْ = بِ (about) + إِيمَان (faith) + كُمْ (all of you). Compare ـكُمَا = both of you.",
    ms:"بِإِيمَانِكُمْ = بِ (dengan) + إِيمَان (keimanan) + كُمْ (kamu semua). Bandingkan ـكُمَا = kamu berdua. Terjemahan Sheikh Abdullah Basmeih: 'Dan Allah lebih mengetahui akan iman kamu;'"}},
{id:9,r:{en:"Surah Al-Ahzab, 33:37 (excerpt)",ms:"Surah al-Ahzab, 33:37 (petikan)"},a:A9,ns:1,p:{en:"How many pronouns that are attached to Isim are there in this excerpt from verse 37 of Surah Al-Ahzab?",ms:"Berapakah bilangan dhomir yang bersambung dengan isim dalam petikan ayat 37 Surah al-Ahzab ini?"},
 o:[{en:"2",ms:"2"},{en:"3",ms:"3"},{en:"4",ms:"4"},{en:"5",ms:"5"}],c:[1],
 n:{en:"Three: زَوْجَكَ (ـكَ), نَفْسِكَ (ـكَ), مُبْدِيهِ (ـهِ). Not counted: عَلَيْهِ and عَلَيْكَ (attached to a harf), أَنْعَمْتَ (attached to a verb) and تَخْشَاهُ (attached to a verb).",
    ms:"Tiga: زَوْجَكَ (ـكَ), نَفْسِكَ (ـكَ), مُبْدِيهِ (ـهِ). Tidak dikira: عَلَيْهِ dan عَلَيْكَ (bersambung dengan harf), أَنْعَمْتَ (bersambung dengan kata kerja) dan تَخْشَاهُ (bersambung dengan kata kerja). Terjemahan Sheikh Abdullah Basmeih: 'Dan (ingatlah wahai Muhammad) ketika engkau berkata kepada orang yang telah dikurniakan oleh Allah (dengan nikmat Islam) dan yang engkau juga telah berbuat baik kepadanya: 'Jangan ceraikan isterimu itu dan bertaqwalah kepada Allah', sambil engkau menyembunyikan dalam hatimu perkara yang Allah akan menyatakannya; dan engkau pula takut kepada (cacian manusia padahal Allah jualah yang berhak engkau takuti (melanggar perintahNya).'"}},
{id:10,r:{en:"Surah Al-Masad",ms:"Surah al-Masad"},a:A10,ns:1,p:{en:"How many pronouns that are attached to Isim are there in this surah?",ms:"Berapakah bilangan dhomir yang bersambung dengan isim dalam surah ini?"},
 o:[{en:"1",ms:"1"},{en:"2",ms:"2"},{en:"3",ms:"3"},{en:"4",ms:"4"}],c:[2],
 n:{en:"Three: مَالُهُ (ـهُ), امْرَأَتُهُ (ـهُ), جِيدِهَا (ـهَا). عَنْهُ is not counted because the pronoun is attached to a harf.",
    ms:"Tiga: مَالُهُ (ـهُ), امْرَأَتُهُ (ـهُ), جِيدِهَا (ـهَا). عَنْهُ tidak dikira kerana dhomir itu bersambung dengan harf. Terjemahan Sheikh Abdullah Basmeih: 'Hartanya dan segala yang diusahakannya, tidak dapat menolongnya. (ayat 2) ... Dan juga isterinya, seorang perempuan pemunggah kayu api. (ayat 4) ... Di lehernya sejenis tali, dari tali-tali yang dipintal. (ayat 5)'"}}
];

const $ = id => document.getElementById(id);
let order = [], cur = 0, res = [], status = "", payload = null;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function show(id){ ["landing","quizScreen","results"].forEach(s => $(s).classList.toggle("hidden", s !== id)); window.scrollTo(0,0); }

function init(){
  document.documentElement.lang = QUIZ_LANGUAGE;
  document.title = t("title"); $("title").textContent = t("title"); $("badge").textContent = t("badge");
  $("intro").textContent = t("intro"); $("nameL").textContent = t("nameL"); $("clsL").textContent = t("classL");
  $("cls").placeholder = t("classPh"); $("beginBtn").textContent = t("begin"); $("resTitle").textContent = t("resTitle");
  $("againBtn").textContent = t("again"); $("retrySub").textContent = t("retry");
  $("beginBtn").onclick = start; $("againBtn").onclick = start; $("retrySub").onclick = submit;
}

function start(){
  const n = $("name").value.trim(), c = $("cls").value.trim();
  if (!n || !c){ $("err").textContent = t("required"); show("landing"); return; }
  $("err").textContent = "";
  order = shuffle(Q).map(q => ({q, opts: q.ns ? q.o.map((o,i)=>({o,i})) : shuffle(q.o.map((o,i)=>({o,i})))}));
  cur = 0; res = []; status = ""; payload = null; show("quizScreen"); render();
}

function ayahHTML(q, revealed){
  return '<div class="ayah" dir="rtl" id="ayah">' + q.a.map(k => {
    const g = (k[3] && !revealed) ? "?" : (QUIZ_LANGUAGE === "ms" ? k[2] : k[1]);
    return '<div class="tok' + (k[3] ? ' boxed' : '') + '"><span class="ar arabic">' + k[0] + '</span><span class="gl">' + g + '</span></div>';
  }).join("") + '</div>';
}

function render(){
  const {q, opts} = order[cur], multi = q.c.length > 1;
  $("prog").style.width = (cur / order.length * 100) + "%";
  $("pcount").textContent = t("qOf").replace("{n}", cur + 1).replace("{t}", order.length);
  $("qcard").innerHTML =
    (q.r ? '<div class="ref">' + T(q.r) + '</div>' : '') + (q.a ? ayahHTML(q, false) : '') +
    '<div class="q">' + AR(T(q.p)) + '</div>' + (multi ? '<div class="hint">' + t("multi") + '</div>' : '') +
    '<div id="opts">' + opts.map(x => '<label class="opt" data-i="' + x.i + '"><input type="' + (multi ? 'checkbox' : 'radio') + '" name="o" value="' + x.i + '"><span class="ot' + (x.o.ar ? ' arabic' : '') + '">' + (x.o.ar || T(x.o)) + '</span></label>').join("") + '</div>' +
    '<div id="fb"></div><button id="chk" disabled>' + t("check") + '</button> <button id="nxt" class="hidden">' + (cur === order.length - 1 ? t("see") : t("next")) + '</button>';
  document.querySelectorAll("input[name=o]").forEach(i => i.onchange = () => $("chk").disabled = !document.querySelector("input[name=o]:checked"));
  $("chk").onclick = check; $("nxt").onclick = () => { if (cur === order.length - 1) showResults(); else { cur++; render(); } };
}

function check(){
  const {q} = order[cur];
  const sel = [...document.querySelectorAll("input[name=o]:checked")].map(x => +x.value);
  const ok = sel.length === q.c.length && q.c.every(i => sel.includes(i));
  res.push({id: q.id, ok});
  document.querySelectorAll(".opt").forEach(l => {
    const i = +l.dataset.i; l.querySelector("input").disabled = true;
    if (q.c.includes(i)) l.classList.add(sel.includes(i) ? "ok" : "miss"); else if (sel.includes(i)) l.classList.add("bad");
  });
  if (q.a) $("ayah").outerHTML = ayahHTML(q, true);
  $("fb").innerHTML = '<div class="fb ' + (ok ? 'ok' : 'bad') + '"><b>' + (ok ? t("right") : t("wrong")) + '</b><span>' + AR(T(q.n)) + '</span></div>';
  $("chk").classList.add("hidden"); $("nxt").classList.remove("hidden");
  if (cur === order.length - 1) finish();   // auto-submit the moment the last question is checked
}

function finish(){
  const score = res.filter(r => r.ok).length, max = order.length;
  const details = res.slice().sort((a,b) => a.id - b.id).map(r => "Q" + r.id + " (" + (r.ok ? 1 : 0) + "/1)").join("; ");
  payload = {name: $("name").value.trim(), className: $("cls").value.trim(), level: "", sheetId: "1C85A3-4EU85NXhcUCwMe2IgQFV2PgpVnXRennPXE0Fs", score, scoreMax: max, percentage: Math.round(score / max * 100), details, submittedAt: new Date().toISOString()};
  submit();
}

async function submit(){
  setStatus("submitting");
  if (SHEET_WEBAPP_URL.indexOf("PASTE_YOUR") === 0){ setStatus("notConfigured"); return; }
  try{
    await fetch(SHEET_WEBAPP_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(payload)});
    setStatus("submitted");
  }catch(e){ setStatus("failed"); }
}
function setStatus(k){
  status = k; $("status").textContent = t(k);
  $("retrySub").classList.toggle("hidden", !(k === "failed" || k === "notConfigured"));
}

function showResults(){
  $("pct").textContent = payload.percentage + "%"; $("pts").textContent = payload.score + " / " + payload.scoreMax;
  $("rlist").innerHTML = res.slice().sort((a,b) => a.id - b.id).map(r => '<li><span>' + t("qn") + ' ' + r.id + '</span><span class="' + (r.ok ? 'pass' : 'fail') + '">' + (r.ok ? t("pass") : t("fail")) + '</span></li>').join("");
  setStatus(status); show("results");
}
init();
</script>
</body>
